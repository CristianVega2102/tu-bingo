<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TU BINGO · Administrador</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#120d2b;--p:#1d1646;--p2:#2a2060;--line:#3a2f7a;--gold:#ffc83d;--pink:#ff5c8a;--ink:#f3f0ff;--mute:#a79fd6;--bad:#ff6b6b;--ok:#4be08a;--f:'Fredoka',system-ui,sans-serif;--b:'Nunito',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--b);min-height:100dvh;display:flex;justify-content:center}
#app{width:100%;max-width:540px;padding:14px 14px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--f);font-size:24px}h1 b{color:var(--gold)}h2{font-family:var(--f);font-size:18px}
.card{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:5px}
input,select{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0e0a24;color:var(--ink)}
button{font-family:var(--f);font-weight:600;border:0;border-radius:12px;padding:12px;font-size:15px;cursor:pointer}
button:disabled{opacity:.4}
.b1{background:var(--gold);color:#2a1f00}.b2{background:var(--p2);color:var(--ink)}.b3{background:none;color:var(--mute)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:2px}
.mono{font-family:var(--f);font-weight:600}.gold{color:var(--gold)}.note{color:var(--mute);font-size:12px}
.err{color:var(--bad);font-size:13px;font-weight:800}.okm{color:var(--ok);font-size:13px;font-weight:800}
.u{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.mv{border-top:1px solid var(--line);padding-top:8px;font-size:13px;display:flex;flex-direction:column;gap:2px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,onSnapshot,getDocs,where,collection,query,orderBy,limit,setDoc,writeBatch,increment,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./config.js";

const A=document.getElementById('app');
const fmt=n=>'$'+Math.round(n||0).toLocaleString('es-AR');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
if(!firebaseConfig.apiKey||String(firebaseConfig.apiKey).startsWith('PEGAR')){A.innerHTML='<div class="card"><h1>Administrador</h1><p>Falta pegar la configuración de Firebase en <b>config.js</b>.</p></div>';throw new Error('Falta config.js')}
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const ts=t=>t&&t.toDate?t.toDate().toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'}):'';
const dtl=t=>{if(!t||!t.toDate)return '';const d=t.toDate(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())};
const orden=l=>l.filter(x=>(x.jugadas||0)>0).map(x=>({...x,perd:(x.jugadas||0)-(x.ganadas||0),pct:Math.round((x.ganadas||0)/x.jugadas*100)})).sort((a,b)=>(b.ganadas||0)-(a.ganadas||0)||b.pct-a.pct||(b.jugadas||0)-(a.jugadas||0)||String(a.name||'').localeCompare(String(b.name||'')));
const fh=t=>{try{return t&&t.toDate?t.toDate().toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'}):''}catch(e){return ''}};
function cajaEl(){
  const el=document.getElementById('caja');if(!el)return;
  const ms_=t=>t&&t.toMillis?t.toMillis():0;
  const mvC=window._mvC.filter(x=>!cajaDesde||ms_(x.creado)>=cajaDesde),mvR=window._mvR.filter(x=>!cajaDesde||ms_(x.creado)>=cajaDesde);
  const sum=l=>l.reduce((a,x)=>a+Math.abs(x.monto||0),0);
  const real=terms.filter(x=>!x.prueba&&(!cajaDesde||ms_(x.creada)>=cajaDesde));
  const prem=x=>(x.ganQuintina?x.ganQuintina.premio||0:0)+(x.ganBingo?x.ganBingo.premio||0:0);
  const com=x=>Math.max(0,(x.pozo||0)-prem(x));
  const totCom=real.reduce((a,x)=>a+com(x),0),totPozo=real.reduce((a,x)=>a+(x.pozo||0),0);
  const mov=[...mvC.map(x=>({...x,k:'c'})),...mvR.map(x=>({...x,k:'d'}))].sort((a,b)=>(b.creado&&b.creado.toMillis?b.creado.toMillis():0)-(a.creado&&a.creado.toMillis?a.creado.toMillis():0));
  const nom=id=>{const u=us.find(x=>x.id===id);return u?u.name:'Cuenta eliminada'};
  el.innerHTML=`<div class="mv"><span>💰 Total acreditado (${mvC.length})</span><b class="mono" style="color:var(--ok);font-size:22px">${fmt(sum(mvC))}</b></div>
  <div class="mv"><span>💸 Total debitado / retirado (${mvR.length})</span><b class="mono" style="color:var(--bad);font-size:22px">${fmt(sum(mvR))}</b></div>
  <div class="mv"><span>🏦 Comisión total de la casa (${real.length} partidas terminadas)</span><b class="mono gold" style="font-size:22px">${fmt(totCom)}</b><span class="note">Pozo total ${fmt(totPozo)} menos premios entregados. Si borrás el historial de mesas, esas partidas dejan de sumar acá.</span></div>
  <h2 style="margin-top:10px">Últimos movimientos</h2>
  ${mov.length?mov.slice(0,40).map(x=>`<div class="mv"><b style="color:var(--${x.k==='c'?'ok':'bad'})">${x.k==='c'?'＋ Acreditado':'− Debitado'} ${fmt(Math.abs(x.monto||0))}</b><span>${esc(nom(x.uid))} · ${esc(fh(x.creado))}</span><span class="note">${esc(x.detalle||'')}${x.por?' · por '+esc(x.por):''}</span></div>`).join(''):'<p class="note">Todavía no hay movimientos registrados.</p>'}
  ${real.length?`<h2 style="margin-top:10px">Comisión por partida</h2>`+real.slice().sort((a,b)=>(b.creada&&b.creada.toMillis?b.creada.toMillis():0)-(a.creada&&a.creada.toMillis?a.creada.toMillis():0)).slice(0,15).map(x=>`<div class="mv"><b>${esc(x.nombre)} · ${esc(fh(x.creada))}</b><span>Pozo ${fmt(x.pozo||0)} · Premios ${fmt(prem(x))} · <b class="gold">Comisión ${fmt(com(x))}</b></span></div>`).join(''):''}`;
}
function rankEl(){
  const el=document.getElementById('rk');if(!el)return;
  const l=orden(rk).slice(0,10);
  el.innerHTML=l.length?l.map((x,i)=>`<div class="mv"><b>${i+1}º ${esc(x.name||'?')}</b><span>${x.ganadas||0} ganadas · ${x.jugadas} jugadas · ${x.perd} perdidas · ${x.pct}%</span></div>`).join(''):'<p class="note">Todavía no hay partidas contadas.</p>';
}
let U=null,me=null,cfg={precioCarton:500,comision:0,pctQuintina:30,pctBingo:70,segBola:6,segInicio:15,whatsapp:''},us=[],ms=[],q='',err='',ok='',unsubs=[],sl={},slOk=false,rk=[],mvC=[],mvR=[],terms=[],cajaDesde=0;window._mvC=[];window._mvR=[];

onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];U=u;me=null;us=[];ms=[];sl={};slOk=false;rk=[];mvC=[];mvR=[];terms=[];cajaDesde=0;window._mvC=[];window._mvR=[];
  if(u){
    unsubs.push(onSnapshot(doc(db,'users',u.uid),s=>{
      const was=me&&me.admin;me=s.exists()?s.data():null;
      if(me&&me.admin&&!was){
        unsubs.push(onSnapshot(collection(db,'users'),s=>{us=s.docs.map(d=>({id:d.id,...d.data()}));lista()}));
        unsubs.push(onSnapshot(query(collection(db,'mesas'),orderBy('creada','desc'),limit(15)),s=>{ms=s.docs.map(d=>({id:d.id,...d.data()}));extras()}));
        unsubs.push(onSnapshot(doc(db,'config','general'),s=>{if(s.exists())cfg={...cfg,...s.data()};view()}));
        // Las mesas fijas cambian seguido (cada vez que arranca una partida): solo se redibuja la primera vez, para no pisar lo que estás escribiendo
        unsubs.push(onSnapshot(collection(db,'salas'),s=>{sl={};s.docs.forEach(d=>{sl[d.id]=d.data()});if(!slOk){slOk=true;view()}}));
        unsubs.push(onSnapshot(query(collection(db,'stats'),orderBy('ganadas','desc'),limit(100)),s=>{rk=s.docs.map(d=>({id:d.id,...d.data()}));rankEl()}));
        // Registro de caja: acreditaciones, débitos y partidas terminadas (para la comisión)
        unsubs.push(onSnapshot(doc(db,'config','caja'),s=>{const d=s.exists()?s.data().desde:null;cajaDesde=d&&d.toMillis?d.toMillis():0;cajaEl()}));
        unsubs.push(onSnapshot(query(collection(db,'movimientos'),where('tipo','==','carga')),s=>{mvC=s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:'estimate'})}));window._mvC=mvC;cajaEl()}));
        unsubs.push(onSnapshot(query(collection(db,'movimientos'),where('tipo','==','retiro')),s=>{mvR=s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:'estimate'})}));window._mvR=mvR;cajaEl()}));
        unsubs.push(onSnapshot(query(collection(db,'mesas'),where('estado','==','terminada')),s=>{terms=s.docs.map(d=>({id:d.id,...d.data()}));cajaEl()}));
      }
      view();
    }));
  }
  view();
});

function view(){
  if(!U)return A.innerHTML=`<h1>TU <b>BINGO</b> · Admin</h1><form class="card" id="f"><input name="email" type="email" placeholder="Correo" required><input name="pass" type="password" placeholder="Contraseña" required>${err?`<div class="err">${err}</div>`:''}<button class="b1">Entrar</button></form>`;
  if(!me)return A.innerHTML='<p class="note">Cargando…</p>';
  if(!me.admin)return A.innerHTML='<h1>Sin permiso</h1><p class="note">Esta cuenta no es de administrador.</p><button class="b2" data-a="salir">Salir</button>';
  A.innerHTML=`<div class="row"><h1>TU <b>BINGO</b> · Admin</h1><button class="b3" data-a="salir">Salir</button></div>
  <div class="card"><h2>Mesas fijas</h2><p class="note">Hay dos mesas fijas que siempre están disponibles: la mesa principal y el torneo. Cuando una empieza su partida, queda lista otra mesa nueva automáticamente. Además podés activar la mesa de práctica. Las bolillas salen solas con el ritmo que fijes abajo. Alcanza con que haya jugadores conectados.</p><a class="b1" style="text-align:center;text-decoration:none;border-radius:12px;padding:12px;font-family:var(--f);font-weight:600" href="index.html">Ir a la app</a></div>
  <form class="card" id="sf"><h2>Configurar mesas fijas</h2>
    <b>🎱 Mesa principal</b>
    <label>Máximo de jugadores (2 a 50)<input name="pc" type="number" min="2" max="50" step="1" value="${(sl.principal&&sl.principal.cupo)||30}"></label>
    <label>Premios<select name="pp"><option value="ambos" ${((sl.principal&&sl.principal.premios)||'ambos')==='ambos'?'selected':''}>Quintina y Bingo</option><option value="bingo" ${(sl.principal&&sl.principal.premios)==='bingo'?'selected':''}>Solo Bingo</option></select></label>
    <p class="note">Empieza una cuenta regresiva cuando hay 2 jugadores; cada jugador nuevo la reinicia. El precio del cartón es el de "Configuración" (más abajo).</p>
    <b>🏆 Torneo</b>
    <label>Fecha y hora del torneo (vacío = sin torneo programado)<input name="tf" type="datetime-local" value="${dtl(sl.torneo&&sl.torneo.fecha)}"></label>
    <label>Precio de inscripción por cartón (pesos)<input name="tp" type="number" min="1" step="1" value="${(sl.torneo&&sl.torneo.precio)||cfg.precioCarton}"></label>
    <label>Máximo de inscriptos (2 a 50)<input name="tc" type="number" min="2" max="50" step="1" value="${(sl.torneo&&sl.torneo.cupo)||50}"></label>
    <label>Premios<select name="tpr"><option value="ambos" ${((sl.torneo&&sl.torneo.premios)||'ambos')==='ambos'?'selected':''}>Quintina y Bingo</option><option value="bingo" ${(sl.torneo&&sl.torneo.premios)==='bingo'?'selected':''}>Solo Bingo</option></select></label>
    <p class="note">La inscripción se cierra a la hora indicada y la partida empieza sola si hay al menos 2 inscriptos. Después de cada torneo, programá la fecha del siguiente.</p>
    <b>🎓 Mesa de práctica</b>
    <label>Estado<select name="pa"><option value="1" ${sl.prueba&&sl.prueba.activa===true?'selected':''}>Activada</option><option value="0" ${sl.prueba&&sl.prueba.activa===true?'':'selected'}>Desactivada</option></select></label>
    <p class="note">Sin saldo y sin esperar rivales: cada usuario juega solo. No cuenta para el ranking. Los cambios de máximo y premios se aplican a la mesa siguiente a la que está esperando ahora.</p>
    ${err?`<div class="err">${err}</div>`:''}${ok?`<div class="okm">${ok}</div>`:''}
    <button class="b1">Guardar mesas fijas</button></form>
  <div class="card"><h2>Cancelar torneo</h2><p class="note">Cancela el torneo que está esperando jugadores: les devuelve la inscripción a sus saldos, borra la mesa y quita la fecha. Después podés programar otro torneo arriba.</p><button class="b2" data-a="cantor">❌ Cancelar torneo y devolver inscripciones</button></div>
  <form class="card" id="cf"><h2>Configuración</h2>
    <label>Precio del cartón (en pesos)<input name="pre" type="number" min="1" step="1" value="${cfg.precioCarton}"></label>
    <label>Premio QUINTINA (% del pozo)<input name="pq" type="number" min="0" max="100" step="1" value="${cfg.pctQuintina}"></label>
    <label>Premio BINGO (% del pozo)<input name="pb" type="number" min="0" max="100" step="1" value="${cfg.pctBingo}"></label>
    <label>Comisión de la casa (%, se descuenta del pozo antes de repartir premios)<input name="com" type="number" min="0" max="50" step="1" value="${cfg.comision||0}"></label>
    <label>Segundos entre bolillas (3 a 60)<input name="seg" type="number" min="3" max="60" step="1" value="${cfg.segBola||6}"></label>
    <label>Cuenta regresiva para iniciar la partida cuando se completa la mesa (5 a 120 segundos)<input name="ini" type="number" min="5" max="120" step="1" value="${cfg.segInicio||15}"></label>
    <label>WhatsApp para cargas y retiros (solo números, con código de país)<input name="wa" inputmode="numeric" value="${esc(cfg.whatsapp||'')}"></label>
    <p class="note">En mesas "solo Bingo", el Bingo cobra la suma de Quintina + Bingo.</p>
    ${err?`<div class="err">${err}</div>`:''}${ok?`<div class="okm">${ok}</div>`:''}
    <button class="b1">Guardar configuración</button></form>
  <div class="card"><h2>📒 Registro de caja</h2><div id="caja"></div><button class="b2" data-a="cajadel">🗑️ Borrar registro de caja y movimientos</button><p class="note">Pone los totales y la lista en cero desde ahora. No cambia los saldos ni el historial que ve cada jugador.</p></div>
  <div class="card"><h2>🏆 Ranking</h2><p class="note">Mejores jugadores por partidas ganadas (Quintina o Bingo). Solo cuentan partidas con dinero.</p><div id="rk"></div>
    <label>Cantidad de jugadores en la imagen<select id="rkn"><option value="10">Top 10</option><option value="15">Top 15</option><option value="20">Top 20</option></select></label>
    <button class="b1" data-a="png">📥 Descargar ranking (PNG)</button><p class="note">Se guarda como imagen en tu teléfono, lista para subir al grupo de WhatsApp.</p><button class="b2" data-a="rkdel">🗑️ Borrar datos del ranking</button><p class="note">Deja el ranking en cero para todos los jugadores.</p></div>
  <div class="card"><h2>Jugadores</h2><div class="note" id="cont"></div><input id="q" placeholder="Buscar por nombre o código" value="${esc(q)}" aria-label="Buscar jugador"><div id="lista"></div></div>
  <div class="card"><div class="row"><h2>Últimas mesas y resultados</h2><button class="b2" data-a="hist">🗑️ Eliminar historial</button></div><p class="note">El pozo se muestra con la comisión ya descontada.</p><div id="ms"></div></div>`;
  lista();extras();rankEl();cajaEl();
}
function lista(){
  const el=document.getElementById('lista');if(!el)return;
  const t=q.trim().toLowerCase();
  const l=us.filter(u=>!t||(u.name||'').toLowerCase().includes(t)||u.id.slice(0,6).toLowerCase().includes(t)).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const ct=document.getElementById('cont');if(ct)ct.textContent=us.length+' registrados';
  el.innerHTML=l.length?l.map(u=>`<div class="u"><div class="row"><b>${esc(u.name||'?')}${u.admin?' (admin)':''}</b><span class="mono gold">${fmt(u.saldo)}</span></div><span class="note">Código ${u.id.slice(0,6)}</span>
    <div class="row"><input id="m-${u.id}" type="number" min="1" step="1" placeholder="Monto" aria-label="Monto para ${esc(u.name||'')}"><button class="b1" data-a="cred" data-u="${u.id}">Acreditar</button><button class="b2" data-a="deb" data-u="${u.id}">Debitar</button></div>${u.admin||u.id===U.uid?'':`<button class="b3" style="color:var(--bad);align-self:flex-start" data-a="del" data-u="${u.id}">🗑️ Eliminar usuario</button>`}</div>`).join(''):'<p class="note">No hay jugadores con ese dato.</p>';
}
function extras(){
  const m=document.getElementById('ms');
  if(m)m.innerHTML=ms.length?ms.map(x=>`<div class="mv"><b>${esc(x.nombre)}${x.sala==='torneo'?' 🏆':''} · ${esc(x.estado)}</b><span>${x.prueba?'🎓 Práctica (sin saldo)':'Pozo '+fmt(x.pozo*(100-(cfg.comision||0))/100)} · ${x.participantes?x.participantes.length:0} jugadores · ${x.premios==='ambos'?'Quintina y Bingo':'Solo Bingo'}</span>
    ${x.ganQuintina?`<span>Quintina: ${esc(x.ganQuintina.nombre)} ${x.prueba?'':'('+fmt(x.ganQuintina.premio)+(x.ganQuintina.pagado?', cobrado':', sin cobrar')+')'}</span>`:''}
    ${x.ganBingo?`<span>Bingo: ${esc(x.ganBingo.nombre)} ${x.prueba?'':'('+fmt(x.ganBingo.premio)+(x.ganBingo.pagado?', cobrado':', sin cobrar')+')'}</span>`:''}
    <span class="note">${ts(x.creada)}</span></div>`).join(''):'<p class="note">Todavía no hay mesas.</p>';
}
async function bajarPng(N){
  const l=orden(rk).slice(0,N);
  try{await document.fonts.load('700 40px Fredoka');await document.fonts.load('800 28px Nunito')}catch(e){}
  const logo=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src='logo.png'});
  const W=1080,LW=640,LH=logo?Math.round(LW*logo.naturalHeight/logo.naturalWidth):0,top=60+LH+150,rowH=96,H=top+Math.max(l.length,1)*rowH+150;
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#2a1c6b');gr.addColorStop(1,'#120d2b');g.fillStyle=gr;g.fillRect(0,0,W,H);
  const rr=(x,y,w,h,r)=>{g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)};
  if(logo)g.drawImage(logo,(W-LW)/2,50,LW,LH);
  g.textAlign='center';g.fillStyle='#ffc83d';g.font='700 64px Fredoka, system-ui, sans-serif';g.fillText('🏆 RANKING',W/2,60+LH+70);
  g.fillStyle='#a79fd6';g.font='800 28px Nunito, system-ui, sans-serif';g.fillText('Mejores jugadores · '+new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'}),W/2,60+LH+115);
  // encabezado de columnas
  const cx={g:700,j:820,p:940,pc:1030};
  g.font='800 22px Nunito, system-ui, sans-serif';g.fillStyle='#a79fd6';g.textAlign='center';
  g.fillText('GAN.',cx.g,top-12);g.fillText('JUG.',cx.j,top-12);g.fillText('PERD.',cx.p,top-12);g.fillText('%',cx.pc,top-12);
  if(!l.length){g.fillStyle='#f3f0ff';g.font='700 32px Fredoka, system-ui, sans-serif';g.fillText('Todavía no hay partidas contadas',W/2,top+60)}
  l.forEach((x,i)=>{
    const y=top+i*rowH;
    g.fillStyle=i<3?'#3a2f7a':'#2a2060';rr(40,y+6,W-80,rowH-14,22);g.fill();
    g.textAlign='center';g.fillStyle='#ffc83d';g.font='700 40px Fredoka, system-ui, sans-serif';g.fillText(['🥇','🥈','🥉'][i]||(i+1)+'º',100,y+rowH/2+14);
    g.textAlign='left';g.fillStyle='#f3f0ff';g.font='700 36px Fredoka, system-ui, sans-serif';
    let nom=String(x.name||'Jugador');while(g.measureText(nom).width>440&&nom.length>1)nom=nom.slice(0,-1);
    g.fillText(nom,170,y+rowH/2+13);
    g.textAlign='center';g.font='700 34px Fredoka, system-ui, sans-serif';
    g.fillStyle='#4be08a';g.fillText(String(x.ganadas||0),cx.g,y+rowH/2+12);
    g.fillStyle='#f3f0ff';g.fillText(String(x.jugadas),cx.j,y+rowH/2+12);
    g.fillStyle='#ff9fb0';g.fillText(String(x.perd),cx.p,y+rowH/2+12);
    g.fillStyle='#ffc83d';g.fillText(x.pct+'%',cx.pc,y+rowH/2+12);
  });
  g.textAlign='center';g.fillStyle='#ffc83d';g.font='700 34px Fredoka, system-ui, sans-serif';g.fillText('¡Jugá, divertite y ganá!',W/2,H-60);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  const a=document.createElement('a'),d=new Date(),p=n=>String(n).padStart(2,'0');
  a.href=URL.createObjectURL(blob);a.download='ranking-tu-bingo-'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'.png';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;lista()}});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=new FormData(e.target);err='';ok='';
  try{
    if(e.target.id==='f')await signInWithEmailAndPassword(auth,f.get('email'),f.get('pass'));
    if(e.target.id==='sf'){
      const n=k=>Math.floor(+f.get(k));
      const pc=n('pc'),tc=n('tc'),tp=n('tp'),fv=String(f.get('tf')||''),fecha=fv?new Date(fv):null;
      if(!(pc>=2&&pc<=50)||!(tc>=2&&tc<=50)||!(tp>=1)){err='Revisá los números: máximo de jugadores entre 2 y 50, y precio mayor a 0.';return view()}
      if(fv&&isNaN(fecha.getTime())){err='La fecha no es válida.';return view()}
      const antes=sl.torneo&&sl.torneo.fecha&&sl.torneo.fecha.toMillis?sl.torneo.fecha.toMillis():0;
      if(fecha&&fecha.getTime()<=Date.now()&&fecha.getTime()!==antes){err='La fecha del torneo tiene que ser futura.';return view()}
      const w=writeBatch(db);
      w.set(doc(db,'salas','principal'),{cupo:pc,premios:String(f.get('pp'))==='bingo'?'bingo':'ambos'},{merge:true});
      w.set(doc(db,'salas','torneo'),{cupo:tc,precio:tp,premios:String(f.get('tpr'))==='bingo'?'bingo':'ambos',fecha:fecha},{merge:true});
      w.set(doc(db,'salas','prueba'),{activa:String(f.get('pa'))==='1'},{merge:true});
      await w.commit();
      ok='Mesas fijas guardadas.';view();return;
    }
    if(e.target.id==='cf'){
      const n=k=>Math.floor(+f.get(k));
      const precioCarton=n('pre'),pctQuintina=n('pq'),pctBingo=n('pb'),comision=n('com'),segBola=n('seg'),segInicio=n('ini');
      if(!(precioCarton>=1)||!(pctQuintina>=0&&pctQuintina<=100)||!(pctBingo>=0&&pctBingo<=100)||!(comision>=0&&comision<=50)||!(segBola>=3&&segBola<=60)||!(segInicio>=5&&segInicio<=120)){err='Revisá los números: precio mayor a 0, porcentajes de 0 a 100, comisión de 0 a 50 segundos entre bolillas de 3 a 60 y cuenta regresiva de 5 a 120.';return view()}
      if(pctQuintina+pctBingo>100){err='Quintina + Bingo no pueden pasar de 100%.';return view()}
      await setDoc(doc(db,'config','general'),{precioCarton,pctQuintina,pctBingo,comision,segBola,segInicio,whatsapp:String(f.get('wa')).replace(/\D/g,'')});
      ok='Configuración guardada. Las mesas nuevas toman el precio nuevo.';view();
    }
  }catch(x){err=x.code==='auth/invalid-credential'?'Correo o contraseña incorrectos.':'No se pudo completar. Probá de nuevo.';view()}
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='salir')return signOut(auth);
  if(a==='rkdel'){
    if(!confirm('Se borran las estadísticas de TODOS los jugadores (jugadas, ganadas y perdidas) y el ranking vuelve a cero. No se puede deshacer. ¿Seguro?'))return;
    b.disabled=true;
    try{
      const snap=await getDocs(collection(db,'stats'));
      for(let i=0;i<snap.docs.length;i+=400){const w=writeBatch(db);snap.docs.slice(i,i+400).forEach(d=>w.delete(d.ref));await w.commit()}
      await setDoc(doc(db,'config','ranking'),{desde:serverTimestamp()});
      alert('Ranking borrado.');
    }catch(x){alert('No se pudo borrar el ranking.')}
    b.disabled=false;return;
  }
  if(a==='cajadel'){
    if(!confirm('Se borra el registro de caja: totales acreditado, debitado y comisión, y la lista de últimos movimientos. Los saldos y el historial de cada jugador NO cambian. No se puede deshacer. ¿Seguro?'))return;
    b.disabled=true;
    try{await setDoc(doc(db,'config','caja'),{desde:serverTimestamp()});alert('Registro de caja borrado.')}catch(x){alert('No se pudo borrar el registro.')}
    b.disabled=false;return;
  }
  if(a==='cantor'){
    b.disabled=true;
    try{
      const snap=await getDocs(query(collection(db,'mesas'),where('sala','==','torneo'),where('estado','==','esperando')));
      const items=[];let tot=0,cant=0;
      for(const d of snap.docs){
        const x=d.data(),js=await getDocs(collection(db,'mesas',d.id,'jugadores'));
        const ju=js.docs.map(j=>{const c=(j.data().cartones||[]).length*(x.precio||0);tot+=c;cant++;return{j,c}});
        items.push({d,ju});
      }
      const msg=cant?'Se cancela el torneo. Se devuelven '+cant+(cant===1?' inscripción':' inscripciones')+' por un total de '+fmt(tot)+' y se quita la fecha. ¿Seguro?':'No hay inscriptos. Se quita la fecha del torneo. ¿Seguro?';
      if(!confirm(msg)){b.disabled=false;return}
      for(const it of items){
        const w=writeBatch(db);
        it.ju.forEach(({j,c})=>{
          if(c>0&&us.find(u=>u.id===j.id)){
            w.update(doc(db,'users',j.id),{saldo:increment(c)});
            w.set(doc(collection(db,'movimientos')),{uid:j.id,tipo:'devolucion',monto:c,detalle:'Torneo cancelado · devolución de inscripción',por:me.name,creado:serverTimestamp()});
          }
          w.delete(j.ref);
        });
        w.delete(it.d.ref);await w.commit();
      }
      await setDoc(doc(db,'salas','torneo'),{fecha:null},{merge:true});
      alert('Torneo cancelado.');
    }catch(x){alert('No se pudo cancelar el torneo.')}
    b.disabled=false;return;
  }
  if(a==='png'){
    b.disabled=true;
    try{await bajarPng(+document.getElementById('rkn').value||10)}catch(x){alert('No se pudo crear la imagen.')}
    b.disabled=false;return;
  }
  if(a==='hist'){
    if(!confirm('Se van a borrar las mesas terminadas cuyos premios ya fueron cobrados (o que no tuvieron ganador), con sus cartones. No se puede deshacer. ¿Seguro?'))return;
    b.disabled=true;
    try{
      const snap=await getDocs(query(collection(db,'mesas'),where('estado','==','terminada')));
      const borrar=snap.docs.filter(d=>{const x=d.data();return x.prueba||((!x.ganQuintina||x.ganQuintina.pagado)&&(!x.ganBingo||x.ganBingo.pagado))});
      let n=0;
      for(const d of borrar){
        const js=await getDocs(collection(db,'mesas',d.id,'jugadores')),w=writeBatch(db);
        js.docs.forEach(j=>w.delete(j.ref));w.delete(d.ref);await w.commit();n++;
      }
      alert(n?'Se borraron '+n+(n===1?' mesa':' mesas')+' del historial.':'No había mesas terminadas para borrar (o tienen premios sin cobrar).');
    }catch(x){alert('No se pudo borrar el historial.')}
    b.disabled=false;return;
  }
  if(a==='del'){
    const u=us.find(x=>x.id===b.dataset.u);if(!u||u.admin||u.id===U.uid)return;
    if(!confirm('Eliminar a '+u.name+'? Se borran sus datos y su saldo ('+fmt(u.saldo||0)+'). Ya no podrá volver a registrarse con ese correo. Si está sentado en una mesa, sacalo antes. No se puede deshacer.'))return;
    b.disabled=true;
    try{
      const w=writeBatch(db);
      w.delete(doc(db,'users',u.id));
      w.set(doc(db,'bloqueados',u.id),{nombre:u.name,por:me.name,creado:serverTimestamp()});
      if((u.saldo||0)>0)w.set(doc(collection(db,'movimientos')),{uid:u.id,tipo:'retiro',monto:-(u.saldo),detalle:'Cuenta eliminada por el administrador',por:me.name,creado:serverTimestamp()});
      await w.commit();
    }catch(x){alert('No se pudo eliminar al usuario.');b.disabled=false}
    return;
  }
  const id=b.dataset.u,n=Math.floor(+document.getElementById('m-'+id).value);
  if(!(n>0))return;
  const u=us.find(x=>x.id===id),sg=a==='cred'?1:-1;
  if(sg<0&&n>(u.saldo||0)){alert('El jugador no tiene tanto saldo.');return}
  if(!confirm(`${sg>0?'Acreditar':'Debitar'} ${fmt(n)} a ${u.name}?`))return;
  b.disabled=true;
  try{
    const w=writeBatch(db);
    w.update(doc(db,'users',id),{saldo:increment(sg*n)});
    w.set(doc(collection(db,'movimientos')),{uid:id,tipo:sg>0?'carga':'retiro',monto:sg*n,detalle:sg>0?'Acreditado por el administrador':'Retiro pagado por el administrador',por:me.name,creado:serverTimestamp()});
    await w.commit();
  }catch(x){alert('No se pudo guardar el movimiento.')}
  b.disabled=false;
});
</script>
