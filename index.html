<body>

<nav id="nav"></nav>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,collection,query,where,writeBatch,runTransaction,serverTimestamp,arrayUnion,arrayRemove,increment} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./config.js";

const VERSION='2026-10-30 · v11';
const A=document.getElementById('app'),NAV=document.getElementById('nav');
const fmt=n=>'$'+Math.round(n||0).toLocaleString('es-AR');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const col=n=>`hsl(${(((n-1)/10)|0)*40+10},72%,50%)`;
if(!firebaseConfig.apiKey||String(firebaseConfig.apiKey).startsWith('PEGAR')){
  A.innerHTML='<div class="card" style="margin-top:20px"><h1>TU BINGO</h1><p>Falta pegar la configuración de Firebase en el archivo <b>config.js</b>.</p></div>';
  throw new Error('Falta config.js');
}
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);

/* ---------- Sonidos (se generan en el navegador, sin archivos) ---------- */
let ctxA=null,sonido=true;
try{sonido=localStorage.getItem('tb_snd')!=='0'}catch(e){}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{
  if(!ctxA){const C=window.AudioContext||window.webkitAudioContext;if(C)ctxA=new C()}
  if(ctxA&&ctxA.state==='suspended')ctxA.resume();
},{passive:true}));
const SON={
  inicio:[[523,0,.16],[659,.16,.16],[784,.32,.16],[1047,.48,.4]],
  bola:[[740,0,.09],[988,.09,.16]],
  quintina:[[659,0,.14],[784,.14,.14],[988,.28,.14],[1319,.42,.5]],
  bingo:[[523,0,.12],[659,.12,.12],[784,.24,.12],[1047,.36,.12],[784,.48,.12],[1047,.6,.12],[1319,.72,.7]],
  tick:[[880,0,.07]],
  error:[[330,0,.18,'triangle'],[247,.18,.3,'triangle']]
};
function sonar(n,extra=0){
  if(!sonido||!SON[n]||!ctxA||ctxA.state!=='running')return;const c=ctxA;
  SON[n].forEach(([f,t,d,tp])=>{const o=c.createOscillator(),g=c.createGain(),t0=c.currentTime+t+extra;
    o.type=tp||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(.22,t0+.02);g.gain.exponentialRampToValueAtTime(.001,t0+d);
    o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+d+.05)});
}

/* ---------- Estado ---------- */
let elim=false,U=null,me=null,cfg={precioCarton:500,comision:0,pctQuintina:30,pctBingo:70,segBola:6,segInicio:15,whatsapp:''};
let abiertas=[],mias=[],hosted=[],movs=[],act=null,jug=null,unsubs=[],unJug=null,unJugKey='';
let pin=null,tab='inicio',modo='in',msg=null,busy=false,online=navigator.onLine,pS=null,MK={};
const pref={prem:'ambos',cupo:'10',n:'1',tipo:'real'};
const MSG={'mesa-cerrada':'La mesa ya empezó o cambió.','mesa-llena':'La mesa se llenó.','sin-saldo':'Saldo insuficiente.','auth/email-already-in-use':'Ese correo ya tiene una cuenta. Probá entrar.','auth/invalid-credential':'Correo o contraseña incorrectos.','auth/weak-password':'La contraseña necesita al menos 6 caracteres.','auth/invalid-email':'Escribí un correo válido.','permission-denied':'El servidor no aceptó la operación. Revisá tu saldo y que la mesa siga abierta.'};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const oculta=id=>lsGet('tb_x_'+id)==='1';
const visible=x=>{const ab=(x.abandonaron||[]).includes(U.uid);if(!ab)return true;const g=x.ganBingo;return x.estado==='terminada'&&!!g&&g.uid===U.uid&&!g.pagado};
let voz=lsGet('tb_voz')!=='0',auto=lsGet('tb_auto')==='1';const abiertos=new Set([0]),rojo=new Set(),panelCerrado=new Set();let pinA=null;

onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];if(unJug)unJug();unJug=null;unJugKey='';
  U=u;me=null;elim=false;abiertas=[];mias=[];hosted=[];movs=[];act=null;jug=null;pS=null;MK={};
  if(u){
    const lista=(q,fn)=>unsubs.push(onSnapshot(q,s=>{fn(s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:'estimate'})})));refrescar()}));
    unsubs.push(onSnapshot(doc(db,'users',u.uid),s=>{me=s.exists()?s.data():null;view()}));
    unsubs.push(onSnapshot(doc(db,'bloqueados',u.uid),s=>{elim=s.exists();view()}));
    unsubs.push(onSnapshot(doc(db,'config','general'),s=>{if(s.exists())cfg={...cfg,...s.data()};view()}));
    unsubs.push(onSnapshot(query(collection(db,'movimientos'),where('uid','==',u.uid)),s=>{movs=s.docs.map(d=>d.data({serverTimestamps:'estimate'}));view()}));
    lista(query(collection(db,'mesas'),where('estado','==','esperando')),l=>abiertas=l);
    lista(query(collection(db,'mesas'),where('participantes','array-contains',u.uid)),l=>mias=l);
    lista(query(collection(db,'mesas'),where('anfitrion','==',u.uid)),l=>hosted=l);
  }
  view();
});
window.addEventListener('online',()=>{online=true;view()});window.addEventListener('offline',()=>{online=false;view()});

function refrescar(){
  const m=new Map();[...mias,...hosted].forEach(x=>m.set(x.id,x));
  const rank={jugando:0,esperando:1,terminada:2};
  const lst=[...m.values()].filter(x=>!oculta(x.id)&&visible(x)).sort((a,b)=>rank[a.estado]-rank[b.estado]||((b.creada&&b.creada.toMillis?b.creada.toMillis():0)-(a.creada&&a.creada.toMillis?a.creada.toMillis():0)));
  const activa=lst.find(x=>x.estado!=='terminada'),cand=pinA&&abiertas.find(x=>x.id===pinA&&x.estado==='esperando');
  act=(pin&&lst.find(x=>x.id===pin))||activa||cand||lst[0]||null;
  const key=act&&act.participantes.includes(U.uid)?act.id:'';
  if(key!==unJugKey){
    if(unJug)unJug();unJug=null;jug=null;unJugKey=key;
    if(key)unJug=onSnapshot(doc(db,'mesas',key,'jugadores',U.uid),s=>{jug=s.exists()?s.data():null;view()});
  }
  sonidos();view();
}
function sonidos(){
  const m=act;if(!m){pS=null;return}
  const s={id:m.id,e:m.estado,n:m.sorteadas.length,q:!!m.ganQuintina,b:!!m.ganBingo};
  if(pS&&pS.id===s.id){
    if(pS.e==='esperando'&&s.e==='jugando')sonar('inicio');
    else if(s.n>pS.n){sonar('bola');hablar(m.sorteadas[m.sorteadas.length-1])}
    if(!pS.q&&s.q)sonar('quintina',.35);
    if(!pS.b&&s.b)sonar('bingo',.35);
  }
  pS=s;
}

/* ---------- Cartones ---------- */
function carton(){
  for(;;){
    const cnt=Array(9).fill(1);let rest=6;
    while(rest>0){const j=Math.random()*9|0;if(cnt[j]<3){cnt[j]++;rest--}}
    const rows=[0,0,0],mask=[];

    for(let j=0;j<9;j++){

async function accion(a,b){
  const u=U.uid,uref=doc(db,'users',u);
  if(a==='crear'){
    await addDoc(collection(db,'mesas'),{nombre:(pref.tipo==='prueba'?'Práctica #':'Mesa #')+(100+Math.floor(Math.random()*900)),anfitrion:u,anfitrionNombre:me.name,premios:pref.prem,cupo:+pref.cupo,precio:pref.tipo==='prueba'?0:cfg.precioCarton,...(pref.tipo==='prueba'?{prueba:true}:{}),estado:'esperando',participantes:[],nombres:{},pozo:0,ncart:0,sorteadas:[],abandonaron:[],llenaEn:null,origen:null,ultimaBola:serverTimestamp(),ganQuintina:null,ganBingo:null,creada:serverTimestamp()});
    tab='inicio';
  }
  if(a==='cancelar')await deleteDoc(doc(db,'mesas',b.dataset.id||act.id));
  if(a==='unirse'){
    const mref=doc(db,'mesas',b.dataset.id),n=+pref.n;
    await runTransaction(db,async t=>{
      const d=(await t.get(mref)).data(),costo=d.prueba?0:n*d.precio;
      if(d.estado!=='esperando'||d.llenaEn||d.participantes.includes(u))throw{code:'mesa-cerrada'};
      if(d.participantes.length>=d.cupo)throw{code:'mesa-llena'};
      if(me.saldo<costo)throw{code:'sin-saldo'};
      const lleno=d.participantes.length+1>=d.cupo,datos={participantes:[...d.participantes,u],pozo:d.pozo+costo,ncart:(d.ncart||0)+n,['nombres.'+u]:me.name};
      if(lleno)datos.llenaEn=serverTimestamp();
      t.set(doc(db,'mesas',mref.id,'jugadores',u),{uid:u,name:me.name,cartones:Array.from({length:n},()=>cartonDoc())});
      t.update(mref,datos);
      if(!d.prueba)t.update(uref,{saldo:increment(-costo)});
      if(!d.prueba)t.set(doc(collection(db,'movimientos')),{uid:u,tipo:'compra',monto:-costo,detalle:d.nombre+' · '+n+(n===1?' cartón':' cartones'),creado:serverTimestamp()});
    });
    tab='inicio';
  }
  if(a==='salirMesa'){
    const m=act,n=jug?jug.cartones.length:0,costo=n*m.precio;
    const w=writeBatch(db);
    w.delete(doc(db,'mesas',m.id,'jugadores',u));
    w.update(doc(db,'mesas',m.id),{participantes:arrayRemove(u),pozo:increment(-costo),ncart:increment(-n),llenaEn:null,forzada:false});
    if(!m.prueba)w.update(uref,{saldo:increment(costo),mesaSalida:m.id,tipoCobro:null});
    if(!m.prueba)w.set(doc(collection(db,'movimientos')),{uid:u,tipo:'devolucion',monto:costo,detalle:m.nombre,creado:serverTimestamp()});
    await w.commit();
  }
  if(a==='revancha'){
    const id0=b.dataset.id,r0=doc(db,'mesas',id0),f=(await getDoc(r0)).data();
    let sig=f.siguiente;
    if(!sig){
      const nref=doc(collection(db,'mesas'));
      try{
        const w=writeBatch(db);
        w.set(nref,{nombre:f.nombre,anfitrion:f.anfitrion,anfitrionNombre:f.anfitrionNombre,premios:f.premios,cupo:f.cupo,precio:f.prueba?0:cfg.precioCarton,...(f.prueba?{prueba:true}:{}),estado:'esperando',participantes:[],nombres:{},pozo:0,ncart:0,sorteadas:[],abandonaron:[],llenaEn:null,origen:id0,ultimaBola:serverTimestamp(),ganQuintina:null,ganBingo:null,creada:serverTimestamp()});
        w.update(r0,{siguiente:nref.id});
        await w.commit();sig=nref.id;
      }catch(e){const f2=(await getDoc(r0)).data();if(f2.siguiente)sig=f2.siguiente;else throw e}
    }
    lsSet('tb_x_'+id0,'1');pinA=sig;tab='inicio';window.scrollTo(0,0);
    msg={t:'ok',x:'Mesa lista. Elegí tus cartones y sentate para jugar de nuevo.'};
    refrescar();
  }
  if(a==='iniciar')await updateDoc(doc(db,'mesas',b.dataset.id||act.id),{llenaEn:serverTimestamp(),forzada:true});
  if(a==='cancelarInicio')await updateDoc(doc(db,'mesas',b.dataset.id||act.id),{llenaEn:null,forzada:false});
  if(a==='aband'){
    const ref=doc(db,'mesas',act.id);let fin=false,gano=false;
    await runTransaction(db,async t=>{
      const d=(await t.get(ref)).data(),a0=d.abandonaron||[];
      if(d.estado!=='jugando'||d.ganBingo||a0.includes(u))return;
      const ab=[...a0,u],restan=d.participantes.filter(x=>!ab.includes(x)),datos={abandonaron:ab};
      if(restan.length<=1){
        const w=restan.length===1?restan[0]:u,k=d.pozo*(100-(cfg.comision||0)),pct=(d.premios==='ambos'&&d.ganQuintina)?cfg.pctBingo:cfg.pctQuintina+cfg.pctBingo;
        datos.ganBingo={uid:w,nombre:(d.nombres||{})[w]||'Jugador',premio:Math.floor(k*pct/10000),pagado:false,abandono:true};datos.estado='terminada';fin=true;gano=w===u;
      }
      t.update(ref,datos);
    });
    msg={t:'ok',x:fin&&gano?'Eras el último jugador: ganaste por abandono. Cobrá tu premio en Inicio.':'Abandonaste la mesa.'};tab='inicio';
  }
  if(a==='recl')await reclamar(b.dataset.t);
  if(a==='cobrar'){
    const t=b.dataset.t,m=[...mias,...hosted].find(x=>x.id===b.dataset.id)||act,g=t==='q'?m.ganQuintina:m.ganBingo,k=t==='q'?'ganQuintina':'ganBingo';
    const w=writeBatch(db);
    w.update(doc(db,'mesas',m.id),{[k+'.pagado']:true});
    w.update(uref,{saldo:increment(g.premio),mesaCobro:m.id,tipoCobro:t,mesaSalida:null});
    w.set(doc(collection(db,'movimientos')),{uid:u,tipo:'premio',monto:g.premio,detalle:(t==='q'?'Quintina':'Bingo')+' · '+m.nombre,creado:serverTimestamp()});
    await w.commit();
    msg={t:'ok',x:'¡Cobraste '+fmt(g.premio)+'!'};
  }
}

/* ---------- Reclamar premios: el servidor (reglas) decide ---------- */
async function reclamar(t){
  const m=act,i=mejor(t),c=jug.cartones[i].c,mk=efect(m,i,c),pr=premios(m),ref=doc(db,'mesas',m.id);
  const base={uid:U.uid,nombre:me.name,carton:i,marcas:mk,pagado:false};
  const datos=t==='q'?{ganQuintina:{...base,fila:mejorFila(c,mk),premio:pr.q}}:{ganBingo:{...base,premio:pr.b},estado:'terminada'};
  try{
    await updateDoc(ref,datos);
    msg={t:'ok',x:t==='q'?'¡QUINTINA aceptada!'+(m.prueba?' Es una práctica: no hay premio.':' Ya podés cobrar tu premio en Inicio.'):'¡BINGO aceptado!'+(m.prueba?' Es una práctica: no hay premio.':' Ya podés cobrar tu premio en Inicio.')};
    tab='inicio';
  }catch(x){
    if(x.code!=='permission-denied')throw x;
    const rz=await diagnostico(t,m,i,mk),motivo=rz.motivo;
    msg={t:'bad',x:'Reclamo de '+(t==='q'?'QUINTINA':'BINGO')+' rechazado. '+motivo};
    sonar('error');
    try{await addDoc(collection(db,'rechazos'),{uid:U.uid,nombre:me.name,mesa:m.id,mesaNombre:m.nombre,premio:t==='q'?'quintina':'bingo',carton:i+1,motivo,marcas:mk,diag:JSON.stringify(rz.diag),version:VERSION,creado:serverTimestamp()})}catch(e){}
  }
}
// Cuando el servidor rechaza, se comparan uno por uno los datos reales (mesa, cartón, configuración)
// con lo que exigen las reglas, para decir exactamente qué falló.
async function diagnostico(t,m,i,mk){
  const D={version:VERSION};let motivo=null;
  try{
    const [ms,js,cs]=await Promise.all([getDoc(doc(db,'mesas',m.id)),getDoc(doc(db,'mesas',m.id,'jugadores',U.uid)),getDoc(doc(db,'config','general'))]);
    const f=ms.exists()?ms.data():null,jd=js.exists()?js.data():null,cf=cs.exists()?cs.data():{};
    D.estado=f&&f.estado;D.premios=f&&f.premios;D.participante=!!(f&&f.participantes.includes(U.uid));D.tieneCarton=!!jd;
    const g=f&&(t==='q'?f.ganQuintina:f.ganBingo);
    if(!f)motivo='La mesa ya no existe.';
    else if(g)motivo='Otro jugador reclamó antes: '+g.nombre+' ganó '+(t==='q'?'la QUINTINA':'el BINGO')+'. El premio es para quien reclama primero.';
    else if(f.estado!=='jugando')motivo='La partida no está en juego.';
    else if(t==='q'&&f.premios!=='ambos')motivo='Esta mesa no reparte Quintina.';
    else if(!D.participante||(f.abandonaron||[]).includes(U.uid))motivo='No estás participando en esta mesa.';
    else if(!jd||!jd.cartones||!jd.cartones[i])motivo='No se encontró tu cartón en el servidor.';
    else{
      const c=jd.cartones[i].c||[],nz=c.filter(Boolean),fuera=mk.filter(n=>!f.sorteadas.includes(n));
      D.celdas=c.length;D.numeros=nz.length;D.distintos=new Set(nz).size;D.marcas=mk;D.fuera=fuera;
      if(fuera.length)motivo='Marcaste números que todavía no salieron: '+fuera.join(', ')+'.';
      else if(c.length!==27||nz.length!==15||new Set(nz).size!==15)motivo='Tu cartón no tiene un formato válido (15 números distintos).';
      else if(t==='q'){const r=mejorFila(c,mk),fr=c.slice(r*9,r*9+9).filter(Boolean);D.fila=r;D.faltan=fr.filter(v=>!mk.includes(v));if(D.faltan.length)motivo='A la fila le falta marcar: '+D.faltan.join(', ')+'.'}
      else{D.faltan=nz.filter(v=>!mk.includes(v));if(D.faltan.length)motivo='Te faltan '+D.faltan.length+' números por marcar.'}
      if(!motivo){
        const com=cf.comision||0,pq=cf.pctQuintina===undefined?30:cf.pctQuintina,pbv=cf.pctBingo===undefined?70:cf.pctBingo;
        const pct=t==='q'?pq:(f.premios==='ambos'?pbv:pq+pbv),esperado=Math.floor(f.pozo*(100-com)*pct/10000);
        D.premioEnviado=premios(m)[t];D.premioServidor=esperado;D.pozo=f.pozo;D.config=cf;
        if(D.premioEnviado!==esperado)motivo='El premio calculado no coincide con la configuración actual. Probá de nuevo.';
      }
    }
  }catch(e){D.error=e.code||e.message}
  return{motivo:motivo||'El servidor rechazó un reclamo que parecía válido. El detalle quedó registrado para el administrador.',diag:D};
}
function motivoRechazo(t,m,c,mk){
  const g=t==='q'?m.ganQuintina:m.ganBingo;
  if(g)return 'Otro jugador reclamó antes: '+g.nombre+' ganó '+(t==='q'?'la QUINTINA':'el BINGO')+'. El premio es para quien reclama primero.';
  if(m.estado!=='jugando')return 'La partida no está en juego.';
  const fuera=mk.filter(n=>!m.sorteadas.includes(n));
  if(fuera.length)return 'Marcaste números que todavía no salieron: '+fuera.join(', ')+'.';
  if(t==='q'){
    for(let r=0;r<3;r++){const f=c.slice(r*9,r*9+9).filter(Boolean);if(f.every(v=>mk.includes(v)))return 'El servidor no pudo validar la fila.'}
    return 'Ninguna fila tiene sus 5 números marcados.';
  }
  const falta=c.filter(v=>v&&!mk.includes(v)).length;
  return falta?'Te faltan '+falta+' números por marcar.':'El servidor no pudo validar el cartón.';
}

/* ---------- Bolillero automático ---------- */
// Al iniciar la partida, las bolillas salen solas con el ritmo que fija el administrador.
// Las dispara cualquier pantalla conectada de la mesa; las reglas de Firebase impiden adelantarse.
// El tiempo se mide desde que esta pantalla VIO la última bolilla (no depende del reloj del teléfono).
const sorteando={},jit={},visto={};
let sorteoErr=null,fallos=0;
const segMs=()=>Math.max(3,+cfg.segBola||6)*1000;
function toca(m,ahora){
  const n=m.sorteadas.length,v=visto[m.id];
  if(!v||v.n!==n){visto[m.id]={n,t:ahora};return false}
  if(jit[m.id]===undefined)jit[m.id]=m.anfitrion===U.uid?0:300+Math.floor(Math.random()*1500);
  return ahora-v.t>=segMs()+jit[m.id];
}
async function sortear(m){
  sorteando[m.id]=Date.now();
  const esperado=m.sorteadas.length;
  try{
    const ref=doc(db,'mesas',m.id);
    await runTransaction(db,async t=>{
      const d=(await t.get(ref)).data();
      if(d.estado!=='jugando'||d.ganBingo||d.sorteadas.length!==esperado||d.sorteadas.length>=90)return;
      const pool=Array.from({length:90},(_,i)=>i+1).filter(n=>!d.sorteadas.includes(n));
      const n=pool[crypto.getRandomValues(new Uint32Array(1))[0]%pool.length];
      t.update(ref,{sorteadas:[...d.sorteadas,n],ultimaBola:serverTimestamp()});
    });
    fallos=0;if(sorteoErr){sorteoErr=null;view()}
  }catch(e){
    fallos++;
    if(fallos>=3&&!sorteoErr){sorteoErr=e.code||e.message||'error';view()}
  }
}
setInterval(()=>{
  if(!U||sorteoErr)return;
  const cand=new Map();[...hosted,...mias].forEach(m=>{if(m.estado==='jugando'&&!(m.abandonaron||[]).includes(U.uid))cand.set(m.id,m)});
  cand.forEach(m=>{
    if(m.ganBingo||m.sorteadas.length>=90||Date.now()-(sorteando[m.id]||0)<3000)return;
    if(toca(m,Date.now()))sortear(m);
  });
},500);
// Cuenta regresiva del bolillero ("Siguiente")
setInterval(()=>{
  const m=act;if(!m||m.estado!=='jugando')return;
  const v=visto[m.id];if(!v)return;
  const seg=segMs(),rem=Math.max(0,seg-(Date.now()-v.t)),el=document.getElementById('sig'),rg=document.getElementById('ring');
  if(el)el.textContent=rem>0?(rem/1000).toFixed(1)+'s':'…';
  if(rg)rg.style.strokeDashoffset=String(163.4*(rem/seg));
},200);

/* ---------- Inicio automático (mesa completa o inicio de emergencia) ---------- */
// Cuando se llena el cupo, o el administrador fuerza el inicio, empieza una cuenta regresiva.
// Al terminar, cualquier jugador conectado de la mesa inicia la partida.
const vistoLleno={},iniciando={},jit2={},anunciado={};
const segInicioMs=()=>Math.max(5,+cfg.segInicio||15)*1000;
const restaInicio=m=>{const v=vistoLleno[m.id]||Date.now();return Math.max(0,Math.ceil((segInicioMs()-(Date.now()-v))/1000))};
const cuentaActiva=m=>m.estado==='esperando'&&!!m.llenaEn&&(m.participantes.length>=m.cupo||!!m.forzada);
async function iniciarMesa(m){
  iniciando[m.id]=Date.now();
  try{
    const ref=doc(db,'mesas',m.id);
    await runTransaction(db,async t=>{
      const d=(await t.get(ref)).data();
      if(d.estado!=='esperando'||!d.llenaEn||!(d.participantes.length>=d.cupo||d.forzada)||d.participantes.length<1)return;
      t.update(ref,{estado:'jugando',ultimaBola:serverTimestamp()});
    });
  }catch(e){}
}
setInterval(()=>{
  if(!U)return;
  const todas=new Map();[...mias,...hosted].forEach(m=>todas.set(m.id,m));
  todas.forEach(m=>{
    if(!cuentaActiva(m)){delete vistoLleno[m.id];delete anunciado[m.id];return}
    if(!vistoLleno[m.id]){vistoLleno[m.id]=Date.now();view()}
    if(jit2[m.id]===undefined)jit2[m.id]=Math.floor(Math.random()*1500);
    if(Date.now()-vistoLleno[m.id]>=segInicioMs()+jit2[m.id]&&Date.now()-(iniciando[m.id]||0)>4000)iniciarMesa(m);
  });
  if(act&&cuentaActiva(act)){
    const r=restaInicio(act),el=document.getElementById('cdi');if(el)el.textContent=r;
    if(r>=1&&r<=5&&anunciado[act.id]!==r){anunciado[act.id]=r;sonar('tick');const t=decirCuenta(r);if(t)hablarTexto(t)}
  }
},400);
</script>
