  const lst=[...m.values()].filter(x=>!oculta(x.id)&&visible(x)&&!(x.estado==='esperando'&&dejada(x.id))).sort((a,b)=>rank[a.estado]-rank[b.estado]||((b.creada&&b.creada.toMillis?b.creada.toMillis():0)-(a.creada&&a.creada.toMillis?a.creada.toMillis():0)));
  const activa=lst.find(x=>x.estado!=='terminada'),cand=pinA&&abiertas.find(x=>x.id===pinA&&x.estado==='esperando');
  const prev=act&&lst.find(x=>x.id===act.id&&x.estado!=='terminada');
  act=(pin&&lst.find(x=>x.id===pin))||prev||activa||cand||lst[0]||null;
  const key=act&&act.participantes.includes(U.uid)?act.id:'';

  }

/* ---------- Cartones ---------- */
function carton(){
  for(;;){
    const cnt=Array(9).fill(1);let rest=6;
    while(rest>0){const j=Math.random()*9|0;if(cnt[j]<3){cnt[j]++;rest--}}
    const rows=[0,0,0],mask=[];
    for(let j=0;j<9;j++){const r=[0,1,2].sort(()=>Math.random()-.5).slice(0,cnt[j]);mask.push(r.sort());r.forEach(x=>rows[x]++)}
    if(!rows.every(x=>x===5))continue;
    const c=Array(27).fill(0);
    for(let j=0;j<9;j++){
      const lo=j===0?1:j*10,hi=j===8?90:j*10+9,pool=[];for(let n=lo;n<=hi;n++)pool.push(n);
      const nums=[];while(nums.length<cnt[j])nums.push(pool.splice(Math.random()*pool.length|0,1)[0]);
      nums.sort((a,b)=>a-b);mask[j].forEach((r,i)=>{c[r*9+j]=nums[i]});
    }
    return c;
  }
}

// Marcas efectivas del cartón i: las manuales, más las que salieron si está activo el Auto-Marcado
function efect(m,i,c){
  const man=marks(m.id,i).filter(v=>m.sorteadas.includes(v));
  if(!auto)return man;
  const t=new Set(man);
  c.forEach(v=>{if(v&&m.sorteadas.includes(v))t.add(v)});
  const res=[...t].sort((a,b)=>a-b);
  if(MK[m.id]?.[i]?.length !== res.length){
    if(!MK[m.id]) MK[m.id]={};
    MK[m.id][i]=res;
    lsSet(mkKey(m.id),JSON.stringify(MK[m.id]));
  }
  return res;
}
function analiza(m,i,c){
  const mk=efect(m,i,c),nums=c.filter(Boolean),marcados=nums.filter(v=>mk.includes(v)).length;
  let bestRow=0,miss=9,missNum=0,filaLista=-1;
  for(let r=0;r<3;r++){const f=c.slice(r*9,r*9+9).filter(Boolean),falt=f.filter(v=>!mk.includes(v));
    if(falt.length<miss){miss=falt.length;bestRow=r;missNum=falt[0]||0}
    if(!falt.length&&filaLista<0)filaLista=r}
  return{mk,marcados,falta:15-marcados,miss,bestRow,missNum,filaLista,aciertos:nums.filter(v=>mk.includes(v)&&m.sorteadas.includes(v)).length};
}

}

// Suma al ranking cada partida terminada (una sola vez por partida; las reglas de Firebase lo verifican)
async function contar(){
  if(contando||!U||!me||!rkListo)return;contando=true;
  try{
    for(const m of mias){
      const k='tb_st_'+m.id+'_'+U.uid;
      if(m.estado!=='terminada'||m.prueba||lsGet(k))continue;
      const cm=m.creada&&m.creada.toMillis?m.creada.toMillis():0;
      if(cm&&cm<rkDesde){lsSet(k,'1');continue}
      try{
        const sref=doc(db,'stats',U.uid),sd=await getDoc(sref),p=sd.exists()?sd.data():{jugadas:0,ganadas:0,bingos:0,quintinas:0};
        const b=m.ganBingo&&m.ganBingo.uid===U.uid?1:0,q=m.ganQuintina&&m.ganQuintina.uid===U.uid?1:0;
        const w=writeBatch(db);
        w.set(doc(db,'stats',U.uid,'partidas',m.id),{creado:serverTimestamp()});
        w.set(sref,{name:me.name,jugadas:(p.jugadas||0)+1,ganadas:(p.ganadas||0)+((b+q)>0?1:0),bingos:(p.bingos||0)+b,quintinas:(p.quintinas||0)+q,ultima:m.id});
        await w.commit();lsSet(k,'1');
      }catch(e){if(e.code==='permission-denied')lsSet(k,'1')}
    }
  }finally{contando=false}
}
// Mesa principal: siempre hay una mesa esperando. 'previa' es la partida que acaba de empezar (la nueva se programa cuando esa termina)
async function asegurarSala(s,previa){
  if(s!=='principal')return null;
  const sref=doc(db,'salas',s);
  const leer=async()=>{const sd=await getDoc(sref),a=sd.exists()?sd.data().actual:null;if(!a)return null;const md=await getDoc(doc(db,'mesas',a));return md.exists()&&md.data().estado==='esperando'?a:null};
  const ya=await leer();if(ya)return ya;
  const c=salaCfg(s),nref=doc(collection(db,'mesas'));
  try{
    const w=writeBatch(db);
    w.set(nref,{nombre:SALAS_NOM[s],sala:s,anfitrion:U.uid,anfitrionNombre:me.name,premios:c.premios,cupo:c.cupo,precio:c.precio,estado:'esperando',participantes:[],nombres:{},pozo:0,ncart:0,sorteadas:[],abandonaron:[],llenaEn:null,progEn:null,previa:previa||null,origen:null,ultimaBola:serverTimestamp(),ganQuintina:null,ganBingo:null,creada:serverTimestamp()});
    w.set(sref,{actual:nref.id},{merge:true});
    await w.commit();return nref.id;
  }catch(e){return await leer()}
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;

  if(a==='dejar'){lsSet('tb_w_'+b.dataset.id,'1');if(pin===b.dataset.id)pin=null;tab='inicio';window.scrollTo(0,0);return refrescar()}
  if(a==='ocultar'){lsSet('tb_x_'+b.dataset.id,'1');if(pin===b.dataset.id)pin=null;return refrescar()}
  if(a==='ver'){lsSet('tb_w_'+b.dataset.id,'0');pin=b.dataset.id;tab='inicio';window.scrollTo(0,0);return refrescar()}
  if(a==='aband'&&!confirm('Si abandonás, perdés tus cartones y tu parte del pozo. Si queda un solo jugador, gana por abandono. ¿Seguro?'))return;
  busy=true;msg=null;view();
  try{await accion(a,b)}catch(x){msg={t:'bad',x:(MSG[x.code]||'No se pudo completar. Probá de nuevo.')+(x.code?' ['+x.code+']':'')}}
  busy=false;view();
});

async function accion(a,b){
  const u=U.uid,uref=doc(db,'users',u);
  if(a==='unirse'){
    const sl=b.dataset.sala,n=+pref.n;if(sl==='principal'&&cerradaHoy())throw{code:'mesa-cerrada-hoy'};
    const entrar=async mid=>{
      const mref=doc(db,'mesas',mid);
      await runTransaction(db,async t=>{
        const d=(await t.get(mref)).data(),costo=d.prueba?0:n*d.precio;
        if(d.estado!=='esperando'||d.participantes.includes(u))throw{code:'mesa-cerrada'};
        if(d.participantes.length>=d.cupo)throw{code:'mesa-llena'};
        if(me.saldo<costo)throw{code:'sin-saldo'};
        if(d.sala==='principal'){if(cerradaHoy())throw{code:'mesa-cerrada-hoy'};if(!(inicioDe(d)>Date.now()))throw{code:'inscripcion-cerrada'}}
        const datos={participantes:[...d.participantes,u],pozo:d.pozo+costo,ncart:(d.ncart||0)+n,['nombres.'+u]:me.name};
        if(d.sala==='prueba')datos.llenaEn=serverTimestamp();
        t.set(doc(db,'mesas',mref.id,'jugadores',u),{uid:u,name:me.name,cartones:Array.from({length:n},()=>cartonDoc())});
        t.update(mref,datos);
        if(!d.prueba)t.update(uref,{saldo:increment(-costo)});
        if(!d.prueba)t.set(doc(collection(db,'movimientos')),{uid:u,tipo:'compra',monto:-costo,detalle:d.nombre+' · '+n+(n===1?' cartón':' cartones'),creado:serverTimestamp()});
      });
    };
    if(sl==='prueba'){
      const mid=await crearPrueba();
      try{await entrar(mid)}catch(e){try{await deleteDoc(doc(db,'mesas',mid))}catch(_){}throw e}
    }else{
      const v=mesaSala(sl);let mid=v?v.id:await asegurarSala(sl);
      if(!mid)throw{code:'sala-no-disponible'};
      try{await entrar(mid)}catch(e){
        if(e.code!=='mesa-cerrada')throw e;
        mid=await asegurarSala(sl);if(!mid)throw{code:'sala-no-disponible'};
        await entrar(mid);
      }
    }
    tab='inicio';
  }
  if(a==='salirMesa'){
    const m=act,n=jug?jug.cartones.length:0,costo=n*m.precio,quedan=m.participantes.length-1;
    const w=writeBatch(db);
    w.delete(doc(db,'mesas',m.id,'jugadores',u));
    w.update(doc(db,'mesas',m.id),{participantes:arrayRemove(u),pozo:increment(-costo),ncart:increment(-n),llenaEn:null});
    if(!m.prueba)w.update(uref,{saldo:increment(costo),mesaSalida:m.id,tipoCobro:null});
    if(!m.prueba)w.set(doc(collection(db,'movimientos')),{uid:u,tipo:'devolucion',monto:costo,detalle:m.nombre,creado:serverTimestamp()});
    await w.commit();
    if(m.prueba){try{await deleteDoc(doc(db,'mesas',m.id))}catch(e){}}
  }
  if(a==='aband'){
    const ref=doc(db,'mesas',act.id);let fin=false,gano=false;
    await runTransaction(db,async t=>{
      const d=(await t.get(ref)).data(),a0=d.abandonaron||[];
      if(d.estado!=='jugando'||d.ganBingo||a0.includes(u))return;
      const ab=[...a0,u],restan=d.participantes.filter(x=>!ab.includes(x)),datos={abandonaron:ab};
      if(restan.length<=1){
        const w=restan.length===1?restan[0]:u,k=d.pozo*(100-(cfg.comision||0)),pct=(d.premios==='ambos'&&d.ganQuintina)?cfg.pctBingo:cfg.pctQuintina+cfg.pctBingo;
        datos.ganBingo={uid:w,nombre:(d.nombres||{})[w]||'Jugador',premio:Math.floor(k*pct/10000),pagado:false,abandono:true};datos.estado='terminada';fin=true;gano=w===u;
      }
      t.update(ref,datos);
    });
    msg={t:'ok',x:fin&&gano?'Eras el último jugador: ganaste por abandono. Cobrá tu premio en Inicio.':'Abandonaste la mesa.'};tab='inicio';
  }
  if(a==='recl')await reclamar(b.dataset.t);
  if(a==='cobrar'){
    const t=b.dataset.t,m=[...mias,...hosted].find(x=>x.id===b.dataset.id)||act,g=t==='q'?m.ganQuintina:m.ganBingo,k=t==='q'?'ganQuintina':'ganBingo';
    const w=writeBatch(db);
    w.update(doc(db,'mesas',m.id),{[k+'.pagado']:true});
    w.update(uref,{saldo:increment(g.premio),mesaCobro:m.id,tipoCobro:t,mesaSalida:null});
    w.set(doc(collection(db,'movimientos')),{uid:u,tipo:'premio',monto:g.premio,detalle:(t==='q'?'Quintina':'Bingo')+' · '+m.nombre,creado:serverTimestamp()});
    await w.commit();
    msg={t:'ok',x:'¡Cobraste '+fmt(g.premio)+'!'};
  }
}

/* ---------- Reclamar premios: el servidor (reglas) decide ---------- */
async function reclamar(t){
  const m=act,i=mejor(t),c=jug.cartones[i].c,mk=efect(m,i,c),pr=premios(m),ref=doc(db,'mesas',m.id);
  const base={uid:U.uid,nombre:me.name,carton:i,marcas:mk,pagado:false};
  const datos=t==='q'?{ganQuintina:{...base,fila:mejorFila(c,mk),premio:pr.q}}:{ganBingo:{...base,premio:pr.b},estado:'terminada'};
  try{
    await updateDoc(ref,datos);
    msg={t:'ok',x:t==='q'?'¡QUINTINA aceptada!'+(m.prueba?' Es una práctica: no hay premio.':' Ya podés cobrar tu premio en Inicio.'):'¡BINGO aceptado!'+(m.prueba?' Es una práctica: no hay premio.':' Ya podés cobrar tu premio en Inicio.')};
    tab='inicio';
  }catch(x){
    if(x.code!=='permission-denied')throw x;
    const rz=await diagnostico(t,m,i,mk),motivo=rz.motivo;
    msg={t:'bad',x:'Reclamo de '+(t==='q'?'QUINTINA':'BINGO')+' rechazado. '+motivo};
    sonar('error');
    try{await addDoc(collection(db,'rechazos'),{uid:U.uid,nombre:me.name,mesa:m.id,mesaNombre:m.nombre,premio:t==='q'?'quintina':'bingo',carton:i+1,motivo,marcas:mk,diag:JSON.stringify(rz.diag),version:VERSION,creado:serverTimestamp()})}catch(e){}
  }
}
// Cuando el servidor rechaza, se comparan uno por uno los datos reales (mesa, cartón, configuración)
// con lo que exigen las reglas, para decir exactamente qué falló.
async function diagnostico(t,m,i,mk){
  const D={version:VERSION};let motivo=null;
  try{
    const [ms,js,cs]=await Promise.all([getDoc(doc(db,'mesas',m.id)),getDoc(doc(db,'mesas',m.id,'jugadores',U.uid)),getDoc(doc(db,'config','general'))]);
    const f=ms.exists()?ms.data():null,jd=js.exists()?js.data():null,cf=cs.exists()?cs.data():{};
    D.estado=f&&f.estado;D.premios=f&&f.premios;D.participante=!!(f&&f.participantes.includes(U.uid));D.tieneCarton=!!jd;
    const g=f&&(t==='q'?f.ganQuintina:f.ganBingo);
    if(!f)motivo='La mesa ya no existe.';
    else if(g)motivo='Otro jugador reclamó antes: '+g.nombre+' ganó '+(t==='q'?'la QUINTINA':'el BINGO')+'. El premio es para quien reclama primero.';
    else if(f.estado!=='jugando')motivo='La partida no está en juego.';
    else if(t==='q'&&f.premios!=='ambos')motivo='Esta mesa no reparte Quintina.';
    else if(!D.participante||(f.abandonaron||[]).includes(U.uid))motivo='No estás participando en esta mesa.';
    else if(!jd||!jd.cartones||!jd.cartones[i])motivo='No se encontró tu cartón en el servidor.';
    else{
      const c=jd.cartones[i].c||[],nz=c.filter(Boolean),fuera=mk.filter(n=>!f.sorteadas.includes(n));
      D.celdas=c.length;D.numeros=nz.length;D.distintos=new Set(nz).size;D.marcas=mk;D.fuera=fuera;
      if(fuera.length)motivo='Marcaste números que todavía no salieron: '+fuera.join(', ')+'.';
      else if(c.length!==27||nz.length!==15||new Set(nz).size!==15)motivo='Tu cartón no tiene un formato válido (15 números distintos).';
      else if(t==='q'){const r=mejorFila(c,mk),fr=c.slice(r*9,r*9+9).filter(Boolean);D.fila=r;D.faltan=fr.filter(v=>!mk.includes(v));if(D.faltan.length)motivo='A la fila le falta marcar: '+D.faltan.join(', ')+'.'}
      else{D.faltan=nz.filter(v=>!mk.includes(v));if(D.faltan.length)motivo='Te faltan '+D.faltan.length+' números por marcar.'}
      if(!motivo){
        const com=cf.comision||0,pq=cf.pctQuintina===undefined?30:cf.pctQuintina,pbv=cf.pctBingo===undefined?70:cf.pctBingo;
        const pct=t==='q'?pq:(f.premios==='ambos'?pbv:pq+pbv),esperado=Math.floor(f.pozo*(100-com)*pct/10000);
        D.premioEnviado=premios(m)[t];D.premioServidor=esperado;D.pozo=f.pozo;D.config=cf;
        if(D.premioEnviado!==esperado)motivo='El premio calculado no coincide con la configuración actual. Probá de nuevo.';
      }
    }
  }catch(e){D.error=e.code||e.message}
  return{motivo:motivo||'El servidor rechazó un reclamo que parecía válido. El detalle quedó registrado para el administrador.',diag:D};
}
function motivoRechazo(t,m,c,mk){
  const g=t==='q'?m.ganQuintina:m.ganBingo;
  if(g)return 'Otro jugador reclamó antes: '+g.nombre+' ganó '+(t==='q'?'la QUINTINA':'el BINGO')+'. El premio es para quien reclama primero.';
  if(m.estado!=='jugando')return 'La partida no está en juego.';
  const fuera=mk.filter(n=>!m.sorteadas.includes(n));
  if(fuera.length)return 'Marcaste números que todavía no salieron: '+fuera.join(', ')+'.';
  if(t==='q'){
    for(let r=0;r<3;r++){const f=c.slice(r*9,r*9+9).filter(Boolean);if(f.every(v=>mk.includes(v)))return 'El servidor no pudo validar la fila.'}
    return 'Ninguna fila tiene sus 5 números marcados.';
  }
  const falta=c.filter(v=>v&&!mk.includes(v)).length;
  return falta?'Te faltan '+falta+' números por marcar.':'El servidor no pudo validar el cartón.';
}

/* ---------- Bolillero automático ---------- */
// Al iniciar la partida, las bolillas salen solas con el ritmo que fija el administrador.
// Las dispara cualquier pantalla conectada de la mesa; las reglas de Firebase impiden adelantarse.
// El tiempo se mide desde que esta pantalla VIO la última bolilla (no depende del reloj del teléfono).
const sorteando={},jit={},visto={};
let sorteoErr=null,fallos=0;
const segMs=()=>Math.max(3,+cfg.segBola||6)*1000;
function toca(m,ahora){
  const n=m.sorteadas.length,v=visto[m.id];
  if(!v||v.n!==n){visto[m.id]={n,t:ahora};return false}
  if(jit[m.id]===undefined)jit[m.id]=m.anfitrion===U.uid?0:300+Math.floor(Math.random()*1500);
  return ahora-v.t>=segMs()+jit[m.id];
}
async function sortear(m){
  sorteando[m.id]=Date.now();
  const esperado=m.sorteadas.length;
  try{
    const ref=doc(db,'mesas',m.id);
    await runTransaction(db,async t=>{
      const d=(await t.get(ref)).data();
      if(d.estado!=='jugando'||d.ganBingo||d.sorteadas.length!==esperado||d.sorteadas.length>=90)return;
      const pool=Array.from({length:90},(_,i)=>i+1).filter(n=>!d.sorteadas.includes(n));
      const n=pool[crypto.getRandomValues(new Uint32Array(1))[0]%pool.length];
      t.update(ref,{sorteadas:[...d.sorteadas,n],ultimaBola:serverTimestamp()});
    });
    fallos=0;if(sorteoErr){sorteoErr=null;view()}
  }catch(e){
    fallos++;
    if(fallos>=3&&!sorteoErr){sorteoErr=e.code||e.message||'error';view()}
  }
}
setInterval(()=>{
  if(!U||sorteoErr)return;
  const cand=new Map();[...hosted,...mias].forEach(m=>{if(m.estado==='jugando'&&!(m.abandonaron||[]).includes(U.uid))cand.set(m.id,m)});
  cand.forEach(m=>{
    if(m.ganBingo||m.sorteadas.length>=90||Date.now()-(sorteando[m.id]||0)<3000)return;
    if(toca(m,Date.now()))sortear(m);
  });
},500);
// Cuenta regresiva del bolillero ("Siguiente")
setInterval(()=>{
  const m=act;if(!m||m.estado!=='jugando')return;
  const v=visto[m.id];if(!v)return;
  const seg=segMs(),rem=Math.max(0,seg-(Date.now()-v.t)),el=document.getElementById('sig'),rg=document.getElementById('ring');
  if(el)el.textContent=rem>0?(rem/1000).toFixed(1)+'s':'…';
  if(rg)rg.style.strokeDashoffset=String(163.4*(rem/seg));
},200);

/* ---------- Inicio automático ---------- */
// Mesa principal: con 2 o más jugadores corre una cuenta regresiva y cada jugador nuevo la reinicia.
// Mesa principal: empieza a la hora programada (con 2 o más inscriptos). Práctica: cuenta corta de 5 segundos.
// Al terminar, cualquier jugador conectado de la mesa inicia la partida; las reglas de Firebase verifican la hora.
const vistoLleno={},iniciando={},jit2={},anunciado={};
const segInicioMs=m=>5000;
const restaInicio=m=>{const v=vistoLleno[m.id];return v?Math.max(0,Math.ceil((segInicioMs(m)-(Date.now()-v.t))/1000)):Math.ceil(segInicioMs(m)/1000)};
const cuentaActiva=m=>m.estado==='esperando'&&m.sala==='prueba'&&!!m.llenaEn&&m.participantes.length>=1;
const progListo=m=>{const f=inicioDe(m);return m.estado==='esperando'&&m.sala==='principal'&&m.participantes.length>=2&&f>0&&Date.now()>=f};
async function iniciarMesa(m){
  iniciando[m.id]=Date.now();
  try{
    const ref=doc(db,'mesas',m.id);
    await runTransaction(db,async t=>{
      const d=(await t.get(ref)).data();
      if(d.estado!=='esperando'||d.participantes.length<(d.sala==='prueba'?1:2))return;
      t.update(ref,{estado:'jugando',ultimaBola:serverTimestamp()});
    });
    asegurarSala(m.sala,m.id).catch(()=>{});
  }catch(e){}
}
setInterval(()=>{
  if(!U)return;
  mias.forEach(m=>{
    if(m.estado!=='esperando'){delete vistoLleno[m.id];delete anunciado[m.id];return}
    let listo=false;
    if(cuentaActiva(m)){
      const v=vistoLleno[m.id];
      if(!v||v.n!==m.participantes.length){vistoLleno[m.id]={n:m.participantes.length,t:Date.now()};delete anunciado[m.id];delete jit2[m.id];view()}
      if(jit2[m.id]===undefined)jit2[m.id]=Math.floor(Math.random()*1500);
      listo=Date.now()-vistoLleno[m.id].t>=segInicioMs(m)+jit2[m.id];
    }else{
      delete vistoLleno[m.id];delete anunciado[m.id];
      if(progListo(m)){if(jit2[m.id]===undefined)jit2[m.id]=Math.floor(Math.random()*1500);listo=Date.now()>=inicioDe(m)+jit2[m.id]}
    }
    if(listo&&Date.now()-(iniciando[m.id]||0)>4000)iniciarMesa(m);
  });
  if(act&&act.estado==='esperando'){
    if(cuentaActiva(act)){
      const r=restaInicio(act),el=document.getElementById('cdi');if(el)el.textContent=r;
      if(r>=1&&r<=5&&anunciado[act.id]!==r){anunciado[act.id]=r;sonar('tick');const t=decirCuenta(r);if(t)hablarTexto(t)}
    }
  }
  const ct=document.getElementById('cdt');if(ct){const mm=(act&&act.sala==='principal'&&act.estado==='esperando')?act:mesaSala('principal');if(mm)ct.textContent=cuentaProg(mm)}
},400);

/* ---------- Mantenimiento de la mesa principal ---------- */
// Cualquier jugador conectado la mantiene viva: crea la mesa si falta, la programa cuando termina la anterior y,
// si a la hora no hay 2 inscriptos, la reprograma. Las reglas de Firebase verifican cada paso (primero en llegar gana).
let mantiene=false;const chkPrev={};
async function mantener(){
  if(!U||!me||elim||mantiene)return;mantiene=true;
  try{
    const mp=mesaSala('principal');
    if(!mp){await asegurarSala('principal');return}
    // Si el administrador cambió el precio, una mesa vacía con el precio viejo se reemplaza por una nueva
    if(me.admin&&mp.precio!==cfg.precioCarton&&mp.participantes.length===0){await deleteDoc(doc(db,'mesas',mp.id));return}
    if(cerradaHoy())return;
    const ref=doc(db,'mesas',mp.id);
    if(!inicioDe(mp)){
      if(mp.previa){
        const loc=mias.find(x=>x.id===mp.previa);let fin=loc?loc.estado==='terminada':false;
        if(!fin&&!loc&&Date.now()-(chkPrev[mp.id]||0)>8000){chkPrev[mp.id]=Date.now();const pd=await getDoc(doc(db,'mesas',mp.previa));fin=!pd.exists()||pd.data().estado==='terminada'}
        if(!fin)return;
      }
      await updateDoc(ref,{progEn:serverTimestamp()});
    }else if(mp.participantes.length<2&&Date.now()>=inicioDe(mp)+2500+Math.floor(Math.random()*1500)){
      await updateDoc(ref,{progEn:serverTimestamp()});
    }
  }catch(e){}finally{mantiene=false}
}
setInterval(mantener,3000);
</script>
