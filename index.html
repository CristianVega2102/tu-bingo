<style>

.cc{background:#0c241b;border:1px solid #2d5a46;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;color:#e9f3ec}
.cc.cl2{flex-direction:row;align-items:center;gap:12px}.nn{background:#143a2b;border:1px solid #2d5a46;border-radius:10px;padding:10px 12px;font-family:var(--f);font-weight:600;color:#f2c14e}
.tg{background:#143a2b;color:#f2c14e;border-radius:8px;padding:2px 7px;font-size:12px;font-weight:800}

.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}

.fl{color:#7be0a8;font-weight:800}.ac{color:#9cc4ae}.ac b{color:#f2c14e}
.gr{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;background:#050d09;padding:8px;border-radius:12px;border:1px solid #1d4433}
.cl{aspect-ratio:1/1.1;border-radius:7px;display:grid;place-items:center;font-family:var(--f);font-weight:600;font-size:clamp(14px,4.4vw,20px);border:0;padding:0;min-height:0;position:relative;background:#f4f7f5;color:#10261c}
.cl.e{background:#0a1a13}.cl.m{background:#1f7a4d;color:#fff}.cl.m::after{content:'✓';position:absolute;top:1px;right:3px;font-size:9px}
.cl.u::before{content:'★';position:absolute;top:1px;right:3px;font-size:9px;color:#b8860b}.cl.u.m{background:#d9a21b;color:#3a2600}.cl.u.m::before{color:#fff4c2}.cl.u.m::after{content:''}
.cl.p{box-shadow:inset 0 0 0 3px #f2c14e}

.cant{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:4}

<body>
<div id="app"></div>
<nav id="nav"></nav>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,collection,query,where,writeBatch,runTransaction,serverTimestamp,arrayUnion,arrayRemove,increment} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./config.js";

const A=document.getElementById('app'),NAV=document.getElementById('nav');
const fmt=n=>'$'+Math.round(n||0).toLocaleString('es-AR');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const col=n=>`hsl(${(((n-1)/10)|0)*40+10},72%,50%)`;
if(!firebaseConfig.apiKey||String(firebaseConfig.apiKey).startsWith('PEGAR')){
  A.innerHTML='<div class="card" style="margin-top:20px"><h1>TU BINGO</h1><p>Falta pegar la configuración de Firebase en el archivo <b>config.js</b>.</p></div>';
  throw new Error('Falta config.js');
}
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);

/* ---------- Sonidos (se generan en el navegador, sin archivos) ---------- */
let ctxA=null,sonido=true;
try{sonido=localStorage.getItem('tb_snd')!=='0'}catch(e){}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{
  if(!ctxA){const C=window.AudioContext||window.webkitAudioContext;if(C)ctxA=new C()}
  if(ctxA&&ctxA.state==='suspended')ctxA.resume();
},{passive:true}));
const SON={
  inicio:[[523,0,.16],[659,.16,.16],[784,.32,.16],[1047,.48,.4]],
  bola:[[740,0,.09],[988,.09,.16]],
  quintina:[[659,0,.14],[784,.14,.14],[988,.28,.14],[1319,.42,.5]],
  bingo:[[523,0,.12],[659,.12,.12],[784,.24,.12],[1047,.36,.12],[784,.48,.12],[1047,.6,.12],[1319,.72,.7]],
  error:[[330,0,.18,'triangle'],[247,.18,.3,'triangle']]
};
function sonar(n,extra=0){
  if(!sonido||!SON[n]||!ctxA||ctxA.state!=='running')return;const c=ctxA;
  SON[n].forEach(([f,t,d,tp])=>{const o=c.createOscillator(),g=c.createGain(),t0=c.currentTime+t+extra;
    o.type=tp||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(.22,t0+.02);g.gain.exponentialRampToValueAtTime(.001,t0+d);
    o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+d+.05)});
}

/* ---------- Estado ---------- */
let U=null,me=null,cfg={precioCarton:500,comision:0,pctQuintina:30,pctBingo:70,segBola:6,whatsapp:''};
let abiertas=[],mias=[],hosted=[],movs=[],act=null,jug=null,unsubs=[],unJug=null,unJugKey='';
let pin=null,tab='inicio',modo='in',msg=null,busy=false,online=navigator.onLine,pS=null,MK={};
const pref={prem:'ambos',cupo:'10',n:'1'};
const MSG={'auth/email-already-in-use':'Ese correo ya tiene una cuenta. Probá entrar.','auth/invalid-credential':'Correo o contraseña incorrectos.','auth/weak-password':'La contraseña necesita al menos 6 caracteres.','auth/invalid-email':'Escribí un correo válido.','permission-denied':'El servidor no aceptó la operación. Revisá tu saldo y que la mesa siga abierta.'};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const oculta=id=>lsGet('tb_x_'+id)==='1';
let voz=lsGet('tb_voz')!=='0',auto=lsGet('tb_auto')==='1';const abiertos=new Set([0]);

onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];if(unJug)unJug();unJug=null;unJugKey='';
  U=u;me=null;abiertas=[];mias=[];hosted=[];movs=[];act=null;jug=null;pS=null;MK={};
  if(u){
    const lista=(q,fn)=>unsubs.push(onSnapshot(q,s=>{fn(s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:'estimate'})})));refrescar()}));
    unsubs.push(onSnapshot(doc(db,'users',u.uid),s=>{me=s.exists()?s.data():null;view()}));
    unsubs.push(onSnapshot(doc(db,'config','general'),s=>{if(s.exists())cfg={...cfg,...s.data()};view()}));
    unsubs.push(onSnapshot(query(collection(db,'movimientos'),where('uid','==',u.uid)),s=>{movs=s.docs.map(d=>d.data({serverTimestamps:'estimate'}));view()}));
    lista(query(collection(db,'mesas'),where('estado','==','esperando')),l=>abiertas=l);
    lista(query(collection(db,'mesas'),where('participantes','array-contains',u.uid)),l=>mias=l);
    lista(query(collection(db,'mesas'),where('anfitrion','==',u.uid)),l=>hosted=l);
  }
  view();
});
window.addEventListener('online',()=>{online=true;view()});window.addEventListener('offline',()=>{online=false;view()});

function refrescar(){
  const m=new Map();[...mias,...hosted].forEach(x=>m.set(x.id,x));
  const rank={jugando:0,esperando:1,terminada:2};
  const lst=[...m.values()].filter(x=>!oculta(x.id)).sort((a,b)=>rank[a.estado]-rank[b.estado]||((b.creada&&b.creada.toMillis?b.creada.toMillis():0)-(a.creada&&a.creada.toMillis?a.creada.toMillis():0)));
  act=(pin&&lst.find(x=>x.id===pin))||lst[0]||null;
  const key=act&&act.participantes.includes(U.uid)?act.id:'';
  if(key!==unJugKey){
    if(unJug)unJug();unJug=null;jug=null;unJugKey=key;
    if(key)unJug=onSnapshot(doc(db,'mesas',key,'jugadores',U.uid),s=>{jug=s.exists()?s.data():null;view()});
  }
  sonidos();view();
}
function sonidos(){
  const m=act;if(!m){pS=null;return}
  const s={id:m.id,e:m.estado,n:m.sorteadas.length,q:!!m.ganQuintina,b:!!m.ganBingo};
  if(pS&&pS.id===s.id){
    if(pS.e==='esperando'&&s.e==='jugando')sonar('inicio');
    else if(s.n>pS.n){sonar('bola');hablar(m.sorteadas[m.sorteadas.length-1])}
    if(!pS.q&&s.q)sonar('quintina',.35);
    if(!pS.b&&s.b)sonar('bingo',.35);
  }
  pS=s;
}

/* ---------- Cartones ---------- */
function carton(){
  for(;;){
    const cnt=Array(9).fill(1);let rest=6;
    while(rest>0){const j=Math.random()*9|0;if(cnt[j]<3){cnt[j]++;rest--}}
    const rows=[0,0,0],mask=[];
    for(let j=0;j<9;j++){const r=[0,1,2].sort(()=>Math.random()-.5).slice(0,cnt[j]);mask.push(r.sort());r.forEach(x=>rows[x]++)}
    if(!rows.every(x=>x===5))continue;
    const c=Array(27).fill(0);
    for(let j=0;j<9;j++){
      const lo=j===0?1:j*10,hi=j===8?90:j*10+9,pool=[];for(let n=lo;n<=hi;n++)pool.push(n);
      const nums=[];while(nums.length<cnt[j])nums.push(pool.splice(Math.random()*pool.length|0,1)[0]);
      nums.sort((a,b)=>a-b);mask[j].forEach((r,i)=>{c[r*9+j]=nums[i]});
    }
    return c;
  }
}
const mkKey=id=>'tb_mk_'+id+'_'+U.uid;
function marks(id,i){
  if(!MK[id]){try{MK[id]=JSON.parse(lsGet(mkKey(id))||'{}')}catch(e){MK[id]={}}}
  return MK[id][i]||[];
}
function toggle(id,i,n){const s=new Set(marks(id,i));s.has(n)?s.delete(n):s.add(n);MK[id][i]=[...s].sort((a,b)=>a-b);lsSet(mkKey(id),JSON.stringify(MK[id]))}
const premios=m=>{
  const k=m.pozo*(100-(cfg.comision||0)),pb=m.premios==='ambos'?cfg.pctBingo:cfg.pctQuintina+cfg.pctBingo;
  return{q:Math.floor(k*cfg.pctQuintina/10000),b:Math.floor(k*pb/10000)};
};
const U30=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
const DEC=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
const enLetras=n=>n<30?U30[n]:DEC[(n/10)|0]+(n%10?' y '+U30[n%10]:'');
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1),pad=n=>String(n).padStart(2,'0');
// Nombres de la cábala. Los que no figuran se muestran solo con el número.
const NOMBRES={1:'El agua',2:'El niño',3:'San Cono',4:'La cama',5:'El gato',6:'El perro',7:'El revólver',8:'El incendio',9:'El arroyo',10:'El cañón',11:'El minero',12:'El soldado',13:'La yeta',14:'El borracho',15:'La niña bonita',16:'El anillo',17:'La desgracia',18:'La sangre',19:'El pescado',20:'La fiesta',21:'La mujer',22:'El loco',23:'El cocinero',24:'El caballo',25:'La gallina',26:'La misa',27:'El peine',28:'Los cerros',29:'San Pedro',30:'Santa Rosa',31:'La luz',32:'El dinero',33:'Cristo',34:'La cabeza',35:'El pajarito',36:'La castidad',47:'El muerto',48:'El muerto que habla'};
function hablar(n){
  if(!voz||!n||!('speechSynthesis' in window))return;
  try{const u=new SpeechSynthesisUtterance(enLetras(n)+(NOMBRES[n]?'. '+NOMBRES[n]:''));u.lang='es-AR';u.rate=.95;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}
// Marcas efectivas del cartón i: las manuales, más las que salieron si está activo el Auto-Marcado
function efect(m,i,c){
  const man=marks(m.id,i);if(!auto)return man;
  const t=new Set(man);c.forEach(v=>{if(v&&m.sorteadas.includes(v))t.add(v)});return [...t].sort((a,b)=>a-b);
}
function analiza(m,i,c){
  const mk=efect(m,i,c),nums=c.filter(Boolean),marcados=nums.filter(v=>mk.includes(v)).length;
  let bestRow=0,miss=9,missNum=0,filaLista=-1;
  for(let r=0;r<3;r++){const f=c.slice(r*9,r*9+9).filter(Boolean),falt=f.filter(v=>!mk.includes(v));
    if(falt.length<miss){miss=falt.length;bestRow=r;missNum=falt[0]||0}
    if(!falt.length&&filaLista<0)filaLista=r}
  return{mk,marcados,falta:15-marcados,miss,bestRow,missNum,filaLista,aciertos:nums.filter(v=>mk.includes(v)&&m.sorteadas.includes(v)).length};
}
function mejor(t){
  let bi=0,bs=-1e9;
  jug.cartones.forEach((k,i)=>{const a=analiza(act,i,k.c),sc=t==='q'?-a.miss*100+a.marcados:a.marcados;if(sc>bs){bs=sc;bi=i}});
  return bi;
}
const mejorFila=(c,mk)=>{let best=0,bn=-1;for(let r=0;r<3;r++){let n=0;for(let j=0;j<9;j++){const v=c[r*9+j];if(v&&mk.includes(v))n++}if(n>bn){bn=n;best=r}}return best};

function view(){
  const y=window.scrollY;
  if(!U){NAV.style.display='none';A.innerHTML=authView();return}
  if(!me){NAV.style.display='none';A.innerHTML='<div class="card" style="margin-top:20px"><p>Cargando tu cuenta…</p></div><div class="load"></div>';return}
  NAV.style.display='flex';
  const T=[['inicio','🏠','Inicio'],['jugar','🎲','Jugar'],['saldo','💰','Saldo'],['cuenta','👤','Cuenta']];
  NAV.innerHTML='<div>'+T.map(([k,i,t])=>`<button class="${tab===k?'on':''}" data-a="tab" data-v="${k}"><span>${i}</span>${t}</button>`).join('')+'</div>';
  const V={inicio:inicioView,jugar:jugarView,saldo:saldoView,cuenta:cuentaView}[tab];
  A.innerHTML=header()+V();
  window.scrollTo(0,y);
}

const cid=(m,i)=>'#'+(m.nombre.replace(/\D/g,'')||'0')+'-'+String.fromCharCode(65+i);
function cartonHTML(m,i,k,ult){
  const c=k.c,a=analiza(m,i,c),n=jug.cartones.length,open=n===1||abiertos.has(i);
  if(!open)return `<div class="cc cl2"><div class="nn">#${i+1}</div><div style="flex:1"><b>Cartón ${cid(m,i)}</b> <span class="tg">A ${a.falta} del Bingo</span><br><span class="nt">Marcados: ${a.marcados} / 15 números</span></div><button class="ver" data-a="abrir" data-i="${i}">Ver grilla</button></div>`;
  return `<div class="cc"><div class="ch"><span class="cid">${cid(m,i)}</span>${a.filaLista>=0?`<span class="fl">✔ Fila ${a.filaLista+1} lista</span>`:''}<span class="ac">Aciertos: <b>${a.aciertos}</b>/15</span></div>
  <div class="gr">${c.map(v=>v?`<button class="cl ${a.mk.includes(v)?'m':''} ${v===ult?'u':''} ${a.miss===1&&v===a.missNum&&Math.floor(c.indexOf(v)/9)===a.bestRow?'p':''}" data-a="mk" data-i="${i}" data-n="${v}" aria-pressed="${a.mk.includes(v)}" aria-label="Número ${v}">${v}</button>`:'<span class="cl e"></span>').join('')}</div>
  <div class="row nt"><span>Progreso del cartón</span><b class="gold">${Math.round(a.marcados/15*100)}%</b></div><div class="pg"><i style="width:${a.marcados/15*100}%"></i></div>
  ${n>1?`<button class="ver" data-a="abrir" data-i="${i}">Ocultar grilla</button>`:''}</div>`;
}
function juegoView(m){
  const s=m.sorteadas,ult=s[s.length-1],pr=premios(m),gq=m.ganQuintina,gb=m.ganBingo,part=m.participantes.includes(U.uid),jugando=m.estado==='jugando';
  const cobro=(g,t,n)=>g&&g.uid===U.uid&&!g.pagado?`<button class="b1" data-a="cobrar" data-t="${t}" ${busy?'disabled':''}>Cobrar ${n} · ${fmt(g.premio)}</button>`:'';
  const nom=ult&&NOMBRES[ult];
  const bol=`<div class="live"><div class="row"><span class="lt"><i class="ld"></i>BOLILLERO CENTRAL EN VIVO</span><button class="voz ${voz?'on':''}" data-a="voz" aria-pressed="${voz}">🔊 ¡Voz Criolla!</button></div>
    <div class="bl"><div class="bolaoro" aria-live="polite">${ult||'—'}</div>
      <div class="binfo"><div class="up">ÚLTIMA BOLA <span class="nb">#${s.length}</span></div><div class="tt">${ult?ult+(nom?' - ¡'+esc(nom)+'!':''):'Esperando…'}</div>${ult?`<div class="it">“${cap(enLetras(ult))}”</div>`:''}</div>
      ${jugando?`<div class="ringw"><svg viewBox="0 0 64 64" aria-hidden="true"><circle class="rb" cx="32" cy="32" r="26"/><circle id="ring" class="rf" cx="32" cy="32" r="26" stroke-dasharray="163.4" stroke-dashoffset="163.4"/></svg><b id="sig">…</b><span>Siguiente</span></div>`:''}</div>
    <div class="ant"><span>ANTERIORES:</span>${s.slice(-7,-1).reverse().map((n,j)=>`<span class="pb" style="opacity:${1-j*.13}">${pad(n)}</span>`).join('')}</div>
    ${jugando?`<p class="nt" style="text-align:center">Las bolillas salen solas cada ${cfg.segBola||6} segundos.</p>`:''}</div>`;
  const prem=`<div class="prem">${m.premios==='ambos'?`<div class="${gq?'g':''}">QUINTINA<b>${fmt(gq?gq.premio:pr.q)}</b><span class="note">${gq?'Ganó '+esc(gq.nombre):'Disponible'}</span></div>`:''}<div class="${gb?'g':''}" ${m.premios==='ambos'?'':'style="grid-column:1/-1"'}>BINGO<b>${fmt(gb?gb.premio:pr.b)}</b><span class="note">${gb?'Ganó '+esc(gb.nombre):'Disponible'}</span></div></div>`;
  let hint='';
  if(part&&jug&&jugando){
    const an=jug.cartones.map((k,i)=>({i,a:analiza(m,i,k.c)}));
    if(m.premios==='ambos'&&!gq){
      const x=an.reduce((p,q)=>q.a.miss<p.a.miss||(q.a.miss===p.a.miss&&q.a.marcados>p.a.marcados)?q:p);
      if(x.a.miss<=2)hint=`<div class="hint"><div><b>${x.a.miss===0?'¡Tenés QUINTINA! Cantala ahora':'¡A '+x.a.miss+(x.a.miss===1?' de la QUINTINA!':' de la QUINTINA!')}</b><br><span class="nt">Cartón ${cid(m,x.i)} en posición ganadora</span></div>${x.a.miss===1?`<span class="fa">Falta marcar: <b>${x.a.missNum}</b></span>`:''}</div>`;
    }else if(!gb){
      const x=an.reduce((p,q)=>q.a.falta<p.a.falta?q:p);
      if(x.a.falta<=3)hint=`<div class="hint"><div><b>${x.a.falta===0?'¡Cartón completo! Cantá BINGO':'¡A '+x.a.falta+' del BINGO!'}</b><br><span class="nt">Cartón ${cid(m,x.i)}</span></div></div>`;
    }
  }
  const cards=part?(jug?`<div class="row"><h2>Tus cartones (${jug.cartones.length})</h2><label class="sw">Auto-Marcado <button class="swb ${auto?'on':''}" data-a="auto" role="switch" aria-checked="${auto}" aria-label="Auto-marcado"><i></i></button></label></div>${hint}${jug.cartones.map((k,i)=>cartonHTML(m,i,k,ult)).join('')}`:'<div class="card"><p>Cargando tus cartones…</p></div>'):'';
  const cant=part&&jug&&jugando?`<div class="cant">${m.premios==='ambos'&&!gq?`<button class="cq" data-a="recl" data-t="q" ${busy?'disabled':''}><b>¡CANTAR QUINTINA!</b><small>El servidor valida tu cartón</small></button>`:''}${!gb?`<button class="cb" data-a="recl" data-t="b" ${busy?'disabled':''}><b>¡CANTAR BINGO!</b><small>Validación del servidor · Pozo ${fmt(m.pozo)}</small></button>`:''}</div>`:'';
  return `${bol}${prem}${cobro(gq,'q','Quintina')}${cobro(gb,'b','Bingo')}${cards}
  ${m.estado==='terminada'?`<div class="card"><b>La partida terminó.</b><button class="b3" data-a="ocultar" data-id="${m.id}" ${(gq&&gq.uid===U.uid&&!gq.pagado)||(gb&&gb.uid===U.uid&&!gb.pagado)?'disabled':''}>Salir de la mesa</button><p class="note">Primero cobrá tus premios, si ganaste.</p></div>`:''}
  <details class="card"><summary>Tablero de 90 números</summary><div class="t90" style="margin-top:10px">${Array.from({length:90},(_,i)=>i+1).map(n=>s.includes(n)?`<span class="t s" style="background:${col(n)}">${n}</span>`:`<span class="t">${n}</span>`).join('')}</div></details>${cant}`;
}

  }
  return h+mesasAbiertas(ocupado);

/* ---------- Acciones ---------- */
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.pref;if(k){pref[k]=e.target.value;view()}});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='f')return;e.preventDefault();
  const f=new FormData(e.target);msg=null;busy=true;view();
  try{
    if(modo==='up'){
      const c=await createUserWithEmailAndPassword(auth,f.get('email'),f.get('pass'));
      await setDoc(doc(db,'users',c.user.uid),{name:String(f.get('nombre')).trim().slice(0,16)||'Jugador',saldo:0,admin:false,creado:serverTimestamp()});
    }else await signInWithEmailAndPassword(auth,f.get('email'),f.get('pass'));
  }catch(x){msg={t:'bad',x:MSG[x.code]||'No se pudo completar. Probá de nuevo.'}}
  busy=false;view();
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='tab'){tab=b.dataset.v;msg=null;window.scrollTo(0,0);return view()}
  if(a==='modo'){modo=b.dataset.v;msg=null;return view()}
  if(a==='cerrarMsg'){msg=null;return view()}
  if(a==='salir')return signOut(auth);
  if(a==='snd'){sonido=!sonido;lsSet('tb_snd',sonido?'1':'0');if(sonido)sonar('inicio');return view()}
  if(a==='mk'){if(act){toggle(act.id,+b.dataset.i,+b.dataset.n);view()}return}
  if(a==='voz'){voz=!voz;lsSet('tb_voz',voz?'1':'0');if(voz&&act&&act.sorteadas.length)hablar(act.sorteadas[act.sorteadas.length-1]);return view()}
  if(a==='auto'){auto=!auto;lsSet('tb_auto',auto?'1':'0');return view()}
  if(a==='abrir'){const i=+b.dataset.i;abiertos.has(i)?abiertos.delete(i):abiertos.add(i);return view()}
  if(a==='ocultar'){lsSet('tb_x_'+b.dataset.id,'1');if(pin===b.dataset.id)pin=null;return refrescar()}
  if(a==='ver'){pin=b.dataset.id;tab='inicio';window.scrollTo(0,0);return refrescar()}
  busy=true;msg=null;view();
  try{await accion(a,b)}catch(x){msg={t:'bad',x:MSG[x.code]||'No se pudo completar. Probá de nuevo.'}}
  busy=false;view();
});

async function accion(a,b){
  const u=U.uid,uref=doc(db,'users',u);
  if(a==='crear'){
    await addDoc(collection(db,'mesas'),{nombre:'Mesa #'+(100+Math.floor(Math.random()*900)),anfitrion:u,anfitrionNombre:me.name,premios:pref.prem,cupo:+pref.cupo,precio:cfg.precioCarton,estado:'esperando',participantes:[],nombres:{},pozo:0,ncart:0,sorteadas:[],ultimaBola:serverTimestamp(),ganQuintina:null,ganBingo:null,creada:serverTimestamp()});
    tab='inicio';
  }
  if(a==='cancelar')await deleteDoc(doc(db,'mesas',b.dataset.id||act.id));
  if(a==='unirse'){
    const m=[...abiertas,...hosted].find(x=>x.id===b.dataset.id),n=+pref.n,costo=n*m.precio;
    if(me.saldo<costo)throw{code:'permission-denied'};
    const w=writeBatch(db);
    w.set(doc(db,'mesas',m.id,'jugadores',u),{uid:u,name:me.name,cartones:Array.from({length:n},()=>({c:carton()}))});
    w.update(doc(db,'mesas',m.id),{participantes:arrayUnion(u),pozo:increment(costo),ncart:increment(n),['nombres.'+u]:me.name});
    w.update(uref,{saldo:increment(-costo)});
    w.set(doc(collection(db,'movimientos')),{uid:u,tipo:'compra',monto:-costo,detalle:m.nombre+' · '+n+(n===1?' cartón':' cartones'),creado:serverTimestamp()});
    await w.commit();tab='inicio';
  }
  if(a==='salirMesa'){
    const m=act,n=jug?jug.cartones.length:0,costo=n*m.precio;
    const w=writeBatch(db);
    w.delete(doc(db,'mesas',m.id,'jugadores',u));
    w.update(doc(db,'mesas',m.id),{participantes:arrayRemove(u),pozo:increment(-costo),ncart:increment(-n)});
    w.update(uref,{saldo:increment(costo),mesaSalida:m.id});
    w.set(doc(collection(db,'movimientos')),{uid:u,tipo:'devolucion',monto:costo,detalle:m.nombre,creado:serverTimestamp()});
    await w.commit();
  }
  if(a==='iniciar')await updateDoc(doc(db,'mesas',b.dataset.id||act.id),{estado:'jugando',ultimaBola:serverTimestamp()});
  if(a==='recl')await reclamar(b.dataset.t);
  if(a==='cobrar'){
    const t=b.dataset.t,m=act,g=t==='q'?m.ganQuintina:m.ganBingo,k=t==='q'?'ganQuintina':'ganBingo';
    const w=writeBatch(db);
    w.update(doc(db,'mesas',m.id),{[k+'.pagado']:true});
    w.update(uref,{saldo:increment(g.premio),mesaCobro:m.id,tipoCobro:t});
    w.set(doc(collection(db,'movimientos')),{uid:u,tipo:'premio',monto:g.premio,detalle:(t==='q'?'Quintina':'Bingo')+' · '+m.nombre,creado:serverTimestamp()});
    await w.commit();
    msg={t:'ok',x:'¡Cobraste '+fmt(g.premio)+'!'};
  }
}

/* ---------- Reclamar premios: el servidor (reglas) decide ---------- */
async function reclamar(t){
  const m=act,i=mejor(t),c=jug.cartones[i].c,mk=efect(m,i,c),pr=premios(m),ref=doc(db,'mesas',m.id);
  const base={uid:U.uid,nombre:me.name,carton:i,marcas:mk,pagado:false};
  const datos=t==='q'?{ganQuintina:{...base,fila:mejorFila(c,mk),premio:pr.q}}:{ganBingo:{...base,premio:pr.b},estado:'terminada'};
  try{
    await updateDoc(ref,datos);
    msg={t:'ok',x:t==='q'?'¡QUINTINA aceptada! Ya podés cobrar tu premio en Inicio.':'¡BINGO aceptado! Ya podés cobrar tu premio en Inicio.'};
    tab='inicio';
  }catch(x){
    if(x.code!=='permission-denied')throw x;
    const motivo=motivoRechazo(t,m,c,mk);
    msg={t:'bad',x:'Reclamo de '+(t==='q'?'QUINTINA':'BINGO')+' rechazado. '+motivo};
    sonar('error');
    try{await addDoc(collection(db,'rechazos'),{uid:U.uid,nombre:me.name,mesa:m.id,mesaNombre:m.nombre,premio:t==='q'?'quintina':'bingo',carton:i+1,motivo,marcas:mk,creado:serverTimestamp()})}catch(e){}
  }
}
function motivoRechazo(t,m,c,mk){
  const g=t==='q'?m.ganQuintina:m.ganBingo;
  if(g)return 'Ese premio ya fue otorgado a '+g.nombre+'.';
  if(m.estado!=='jugando')return 'La partida no está en juego.';
  const fuera=mk.filter(n=>!m.sorteadas.includes(n));
  if(fuera.length)return 'Marcaste números que todavía no salieron: '+fuera.join(', ')+'.';
  if(t==='q'){
    for(let r=0;r<3;r++){const f=c.slice(r*9,r*9+9).filter(Boolean);if(f.every(v=>mk.includes(v)))return 'El servidor no pudo validar la fila.'}
    return 'Ninguna fila tiene sus 5 números marcados.';
  }
  const falta=c.filter(v=>v&&!mk.includes(v)).length;
  return falta?'Te faltan '+falta+' números por marcar.':'El servidor no pudo validar el cartón.';
}

/* ---------- Bolillero automático ---------- */
// Al iniciar la partida, las bolillas salen solas con el ritmo que fija el administrador.
// Las dispara cualquier pantalla conectada de la mesa; las reglas de Firebase impiden adelantarse.
const sorteando={},jit={};
async function sortear(m){
  sorteando[m.id]=Date.now();
  try{
    const ref=doc(db,'mesas',m.id),seg=Math.max(3,+cfg.segBola||6)*1000;
    await runTransaction(db,async t=>{
      const d=(await t.get(ref)).data();
      if(d.estado!=='jugando'||d.ganBingo||d.sorteadas.length>=90)return;
      if(d.ultimaBola&&d.ultimaBola.toMillis&&Date.now()-d.ultimaBola.toMillis()<seg-700)return;
      const pool=Array.from({length:90},(_,i)=>i+1).filter(n=>!d.sorteadas.includes(n));
      const n=pool[crypto.getRandomValues(new Uint32Array(1))[0]%pool.length];
      t.update(ref,{sorteadas:[...d.sorteadas,n],ultimaBola:serverTimestamp()});
    });
  }catch(e){}
}
setInterval(()=>{
  if(!U)return;
  const cand=new Map();[...hosted,...mias].forEach(m=>{if(m.estado==='jugando')cand.set(m.id,m)});
  cand.forEach(m=>{
    if(m.ganBingo||m.sorteadas.length>=90||Date.now()-(sorteando[m.id]||0)<3000)return;
    if(jit[m.id]===undefined)jit[m.id]=m.anfitrion===U.uid?0:300+Math.floor(Math.random()*1500);
    const ult=m.ultimaBola&&m.ultimaBola.toMillis?m.ultimaBola.toMillis():Date.now(),seg=Math.max(3,+cfg.segBola||6)*1000;
    if(Date.now()-ult>=seg+jit[m.id])sortear(m);
  });
},500);
// Cuenta regresiva del bolillero ("Siguiente")
setInterval(()=>{
  const m=act;if(!m||m.estado!=='jugando')return;
  const seg=Math.max(3,+cfg.segBola||6)*1000,ult=m.ultimaBola&&m.ultimaBola.toMillis?m.ultimaBola.toMillis():0;if(!ult)return;
  const rem=Math.max(0,seg-(Date.now()-ult)),el=document.getElementById('sig'),rg=document.getElementById('ring');
  if(el)el.textContent=rem>0?(rem/1000).toFixed(1)+'s':'…';
  if(rg)rg.style.strokeDashoffset=String(163.4*(rem/seg));
},200);
</script>
